// ==================== 复制代码 ====================
function copyCode(block){
    var code = block.querySelector('code');
    if(!code) return;
    var text = code.textContent;
    try {
        navigator.clipboard.writeText(text).then(function(){ showToast('✅ 代码已复制'); })
        .catch(function(){ fallbackCopy(text); });
    } catch(e){ fallbackCopy(text); }
}
function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ 代码已复制');
}

// ★ 从缓存/文件回填的 HTML 统一规范化代码块：
//   强制整块不可编辑、退出编辑态、兜底折叠状态（兼容旧数据没有 contenteditable 属性、
//   或保存时正处于编辑中导致 code 仍可编辑的情况）
function normalizeLoadedBlocks(){
    var blocks = editor.querySelectorAll('.code-block');
    for(var i = 0; i < blocks.length; i++){
        var b = blocks[i];
        b.contentEditable = 'false';
        b.classList.remove('unlocked');
        var code = b.querySelector('code');
        if(code) code.contentEditable = 'false';
        var header = b.querySelector('.code-block-header');
        if(header) header.contentEditable = 'false';
        if(!b.classList.contains('collapsed')) b.classList.add('collapsed');
        updateFoldUI(b);
    }
}

// ==================== 绑定代码块事件（一次性） ====================
function bindCodeBlockEvents(block){
    if(block._bound) return;
    block._bound = true;

    var body = block.querySelector('.code-body');
    var header = block.querySelector('.code-block-header');

    // ★ 头部折叠按钮 —— 任何时候都能折叠：编辑中先锁定再折叠
    var foldBtn = block.querySelector('.fold-btn');
    if(foldBtn){
        foldBtn.addEventListener('mousedown', function(e){
            e.preventDefault();
            e.stopPropagation();
            if(block.classList.contains('unlocked')) lockCodeBlock(block);
            block.classList.toggle('collapsed');
            updateFoldUI(block);
            saveContent();
            setTimeout(scheduleLineUpdate, 380);
            scheduleLineUpdate();
        });
    }

    // ★ 修改语言
    var langBtn = block.querySelector('.lang-change-btn');
    if(langBtn){
        langBtn.addEventListener('mousedown', function(e){ e.preventDefault(); e.stopPropagation(); showLangSelector(block, langBtn); });
    }

    // ★ 复制按钮
    var copyBtn = block.querySelector('.copy-btn');
    if(copyBtn){
        copyBtn.addEventListener('mousedown', function(e){ e.preventDefault(); e.stopPropagation(); copyCode(block); });
    }

    // ★ 删除按钮 —— 移除整个代码块（先清理编辑监听器再移除，随后保存）
    // 兼容旧数据：已保存的代码块可能没有该按钮，动态补齐到 actions
    var delBtn = block.querySelector('.del-code-btn');
    if(!delBtn && header){
        var actBox = header.querySelector('.code-actions');
        if(actBox){
            delBtn = document.createElement('button');
            delBtn.className = 'del-code-btn';
            delBtn.textContent = '删除';
            delBtn.type = 'button';
            actBox.appendChild(delBtn);
        }
    }
    if(delBtn){
        delBtn.addEventListener('mousedown', function(e){
            e.preventDefault();
            e.stopPropagation();
            removeEditListeners(block);
            if(block.parentNode) block.parentNode.removeChild(block);
            saveContent();
            scheduleLineUpdate();
        });
    }

    // ★ 底部折叠按钮 —— 同样保证任何状态可折叠
    var bottomBtn = block.querySelector('.fold-toggle-bottom');
    if(bottomBtn){
        bottomBtn.addEventListener('mousedown', function(e){
            e.preventDefault();
            e.stopPropagation();
            if(block.classList.contains('unlocked')) lockCodeBlock(block);
            block.classList.toggle('collapsed');
            updateFoldUI(block);
            saveContent();
            setTimeout(scheduleLineUpdate, 380);
            scheduleLineUpdate();
        });
    }

    // ★ 代码区域：双击进入编辑（折叠/展开只走按钮，避免误触）
    // 绑定在 .code-body-wrap 而非 .code-body：底部「展开全部」按钮/渐变遮罩是 body 的兄弟节点，
    // 覆盖折叠区时会把 dblclick 冒泡路径挡在 body 之外 → 绑定到 wrap 覆盖整个代码区域
    var wrap = block.querySelector('.code-body-wrap');
    var dblTarget = wrap || body;
    if(dblTarget){
        dblTarget.addEventListener('dblclick', function(e){
            if(e.target.closest('.code-block-header')) return;
            if(e.target.closest('.lang-select-popup')) return;
            if(!block.classList.contains('unlocked')){ unlockCodeBlock(block); }
        });
    }

    // 新建的默认折叠
    if(!block.classList.contains('unlocked') && !block.classList.contains('collapsed')){
        block.classList.add('collapsed');
    }
    updateFoldUI(block);
    setTimeout(function(){ highlightCodeBlock(block); }, 50);
}

// ==================== 创建代码块 ====================
function createCodeBlock(lang, content){
    lang = lang || 'text';
    content = (content !== undefined) ? content : '';

    var block = document.createElement('div');
    block.className = 'code-block collapsed';
    block.dataset.lang = lang;
    // ★ 整块设为不可编辑（子元素 code 解锁时可显式覆盖为 true），
    //   防止光标点进代码块内部结构（header/pre 空白处等），保证块作为独立原子节点插入
    block.contentEditable = 'false';

    // 头部
    var header = document.createElement('div');
    header.className = 'code-block-header';
    header.contentEditable = 'false';

    var label = document.createElement('span');
    label.className = 'lang-label';
    label.textContent = lang;
    header.appendChild(label);

    var actions = document.createElement('div');
    actions.className = 'code-actions';

    var foldBtn = document.createElement('button');
    foldBtn.className = 'fold-btn';
    foldBtn.textContent = '展开';
    foldBtn.type = 'button';
    actions.appendChild(foldBtn);

    var langBtn = document.createElement('button');
    langBtn.className = 'lang-change-btn';
    langBtn.textContent = '修改语言';
    langBtn.type = 'button';
    actions.appendChild(langBtn);

    var copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = '复制';
    copyBtn.type = 'button';
    actions.appendChild(copyBtn);

    // ★ 删除按钮 —— 移除整个代码块
    var delBtn = document.createElement('button');
    delBtn.className = 'del-code-btn';
    delBtn.textContent = '删除';
    delBtn.type = 'button';
    actions.appendChild(delBtn);

    header.appendChild(actions);
    block.appendChild(header);

    // 代码体包裹
    var wrap = document.createElement('div');
    wrap.className = 'code-body-wrap';
    wrap.style.position = 'relative';

    var body = document.createElement('div');
    body.className = 'code-body';

    // ★ 代码块内部行号栏：位于代码框内左侧，行号由 renderCodeGutters() 动态填充
    var gutter = document.createElement('div');
    gutter.className = 'code-gutter';
    gutter.contentEditable = 'false';

    var pre = document.createElement('pre');
    var code = document.createElement('code');
    if(lang && lang !== 'text') code.className = 'language-' + lang;
    code.textContent = content || '// 在这里输入代码...';
    code.contentEditable = 'false';
    pre.appendChild(code);
    body.appendChild(gutter);
    body.appendChild(pre);
    wrap.appendChild(body);

    // 渐变遮罩
    var grad = document.createElement('div');
    grad.className = 'fold-gradient';
    wrap.appendChild(grad);

    // 底部按钮
    var bottomBtn = document.createElement('button');
    bottomBtn.className = 'fold-toggle-bottom';
    bottomBtn.textContent = '展开全部';
    bottomBtn.type = 'button';
    wrap.appendChild(bottomBtn);

    block.appendChild(wrap);
    bindCodeBlockEvents(block);

    return block;
}

// ==================== 插入代码按钮 ====================
// ★ 修改：不再弹窗询问语言，先生成默认 text 代码块，之后通过「修改语言」按钮选择
// 通用插入函数：lang='text' 为普通代码块；lang='html' 且带内容时预览走网页预览容器
function insertCodeBlockAtCursor(lang, content){
    lang = lang || 'text';
    var block = createCodeBlock(lang, content === undefined ? '' : content);
    var sel = window.getSelection();
    var range;
    if(sel.rangeCount > 0){ range = sel.getRangeAt(0); }
    else { range = document.createRange(); range.selectNodeContents(editor); range.collapse(false); }

    // ★ 修正插入点，防止新代码块插进旧代码块内部 / 遗留占位 div：
    //   1) 光标或残留选区位于代码块内（如编辑过旧块后失焦、锁定但选区还在 code 里）
    //      → 先锁定该块，再把插入点移到它之后；
    //   2) 光标位于遗留的空占位 div 等容器内 → 提升到该容器之后（避免嵌套）。
    var sc = range.startContainer;
    var selEl = sc.nodeType === 3 ? sc.parentElement : sc;
    var inBlock = selEl && selEl.closest ? selEl.closest('.code-block') : null;
    if(inBlock){
        if(inBlock.classList.contains('unlocked')) lockCodeBlock(inBlock);
        range.setStartAfter(inBlock);
        range.collapse(true);
    } else if(sc && sc.nodeType === 1 && sc !== editor && !sc.closest('.code-block')){
        range.setStartAfter(sc);
        range.collapse(true);
    }
    sel.removeAllRanges();
    sel.addRange(range);

    range.deleteContents();
    range.insertNode(block);

    var after = document.createElement('div');
    after.innerHTML = '<br>';
    range.setStartAfter(block);
    range.insertNode(after);
    range.setStartAfter(after);
    range.collapse(true);

    sel.removeAllRanges();
    sel.addRange(range);
    editor.focus();

    lockCodeBlock(block);
    saveContent();
    scheduleLineUpdate();
    showToast('✅ 代码块已插入 · ' + lang);
    return block;
}

document.getElementById('insertCodeBtn').addEventListener('click', function(){
    insertCodeBlockAtCursor('text', '');
});


// ==================== 图片/视频/音频插入 ====================
function insertResource(file, type){
    var reader = new FileReader();
    reader.onload = function(e){
        var dataUrl = e.target.result;
        var id = 'res' + (resourceCounter++);
        var isBig = dataUrl.length > IDB_THRESHOLD;

        RESOURCE_MAP.set(id, { filename: file.name, mimeType: file.type, data: dataUrl });
        // ★ 大文件（视频/音频/大图）写入 IndexedDB，编辑器 HTML 里只留引用 ID
        if(isBig){ idbPut(id, dataUrl).catch(function(){}); }

        // 展示用：优先 blob URL（大文件不会把 data URL 塞进 DOM，更省内存）
        var displaySrc = isBig ? URL.createObjectURL(file) : dataUrl;
        var refAttr = isBig ? ' data-res-ref="' + id + '"' : '';

        var html = '';
        if(type === 'image') html = '<img src="' + displaySrc + '"' + refAttr + ' alt="' + file.name + '">';
        else if(type === 'video') html = '<video src="' + displaySrc + '"' + refAttr + ' controls width="100%"></video>';
        else if(type === 'audio') html = '<audio src="' + displaySrc + '"' + refAttr + ' controls></audio>';

        var sel = window.getSelection();
        if(sel.rangeCount > 0){
            var range = sel.getRangeAt(0);
            range.deleteContents();
            var frag = range.createContextualFragment(html);
            var lastNode = frag.lastChild; // ★ 先记住尾节点，insertNode 后 frag 会被清空
            range.insertNode(frag);
            if(lastNode && lastNode.parentNode){
                range.setStartAfter(lastNode);
                range.collapse(true);
            }
            sel.removeAllRanges();
            sel.addRange(range);
        } else { editor.insertAdjacentHTML('beforeend', html); }
        saveContent();
        showToast('✅ 已插入 ' + type + '：' + file.name + (isBig ? '（已存入大容量缓存）' : ''));
    };
    reader.readAsDataURL(file);
}

    fileInput.click();

// ==================== ★ 粘贴图片持久化 ★ ====================
editor.addEventListener('paste', function(e){
    var items = (e.clipboardData || window.clipboardData).items;
    if(!items) return;

    for(var i = 0; i < items.length; i++){
        var item = items[i];
        if(item.type.indexOf('image') === -1) continue;

        e.preventDefault();
        var blob = item.getAsFile();
        if(!blob) continue;

        var reader = new FileReader();
        reader.onload = function(ev){
            var dataUrl = ev.target.result;
            var id = 'res' + (resourceCounter++);
            var filename = 'pasted-' + Date.now() + '.png';
            RESOURCE_MAP.set(id, { filename: filename, mimeType: blob.type, data: dataUrl });

            var img = document.createElement('img');
            img.src = dataUrl;
            img.alt = filename;
            img.style.maxWidth = '100%';

            var sel = window.getSelection();
            if(sel.rangeCount > 0){
                var range = sel.getRangeAt(0);
                range.deleteContents();
                range.insertNode(img);
                range.setStartAfter(img);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            } else { editor.appendChild(img); }

            saveContent();
            showToast('✅ 图片已粘贴并缓存');
        };
        reader.readAsDataURL(blob);
    }
});

// ==================== ★ 图片工具条：调整大小 + 悬浮模式 ★ ====================
var imgPopup = null;
var imgPopupTarget = null;

function closeImgPopup(){
    if(imgPopup){ imgPopup.remove(); imgPopup = null; imgPopupTarget = null; }
}

function applyImgWidth(img, pct){
    img.style.width = pct;
    img.style.height = 'auto';
    saveContent();
    scheduleLineUpdate();
}

function applyImgFloat(img, mode){
    if(mode === 'left'){
        // 左环绕：文字在右侧环绕（WPS 四周型）
        img.style.float = 'left';
        img.style.clear = 'none';
        img.style.display = 'block';
        img.style.margin = '4px 16px 8px 0';
        img.style.verticalAlign = '';
    } else if(mode === 'right'){
        // 右环绕：文字在左侧环绕
        img.style.float = 'right';
        img.style.clear = 'none';
        img.style.display = 'block';
        img.style.margin = '4px 0 8px 16px';
        img.style.verticalAlign = '';
    } else if(mode === 'inline'){
        // 嵌入型：像文字一样嵌在行内
        img.style.float = 'none';
        img.style.clear = 'none';
        img.style.display = 'inline-block';
        img.style.margin = '0 4px';
        img.style.verticalAlign = 'middle';
    } else {
        // 整行（上下型）：独占一行居中，不与任何浮动并排
        img.style.float = 'none';
        img.style.clear = 'both';
        img.style.display = 'block';
        img.style.margin = '8px auto';
        img.style.verticalAlign = '';
    }
    saveContent();
    scheduleLineUpdate();
    positionImgPopup(img);
}

function markActiveBtn(popup, attr, value){
    popup.querySelectorAll('button[data-' + attr + ']').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-' + attr) === value);
    });
}

function positionImgPopup(img){
    if(!imgPopup) return;
    var ir = img.getBoundingClientRect();
    var er = editor.getBoundingClientRect();
    var top = ir.top - er.top + editor.scrollTop - imgPopup.offsetHeight - 8;
    if(top < editor.scrollTop) top = ir.bottom - er.top + editor.scrollTop + 8; // 上方没空间就放下面
    var left = ir.left - er.left + editor.scrollLeft;
    left = Math.max(4, Math.min(left, editor.scrollWidth - imgPopup.offsetWidth - 4));
    imgPopup.style.top = top + 'px';
    imgPopup.style.left = left + 'px';
}

function showImgTools(img){
    closeImgPopup();
    imgPopupTarget = img;

    imgPopup = document.createElement('div');
    imgPopup.className = 'img-tool-popup';
    imgPopup.contentEditable = 'false';

    // 尺寸按钮
    var sizeLabel = document.createElement('span');
    sizeLabel.className = 'itp-label';
    sizeLabel.textContent = '宽度';

    ['25%','50%','75%','100%'].forEach(function(pct){
        var b = document.createElement('button');

        b.setAttribute('data-size', pct);
        b.type = 'button';
        b.addEventListener('mousedown', function(e){
            e.preventDefault(); e.stopPropagation();
            applyImgWidth(img, pct);
            markActiveBtn(imgPopup, 'size', pct);
        });
        imgPopup.appendChild(b);
    });

    // 悬浮按钮
    var floatLabel = document.createElement('span');
    floatLabel.className = 'itp-label';

// ==================== MD 检测 ====================
function detectMarkdown(text){
    var clean = text.replace(/```[\s\S]*?```/g, '');
    var lines = clean.split('\n');
    var mdLines = 0;
    for(var i = 0; i < lines.length; i++){
        var t = lines[i].trim();
        if(/^#{1,6}\s/.test(t)) mdLines++;
        else if(/^[\*\+\-]\s/.test(t)) mdLines++;
        else if(/^\d+\.\s/.test(t)) mdLines++;
        else if(/^>\s/.test(t)) mdLines++;
        else if(/^\|.*\|$/.test(t) && t.split('|').length > 2) mdLines++;
        else if(/\*\*.*\*\*/.test(t) || /__.*__/.test(t)) mdLines++;
        else if(/\[.*\]\(.*\)/.test(t)) mdLines++;
    }
    var total = lines.filter(function(l){ return l.trim()!==''; }).length;
    return total > 0 && (mdLines / total) > 0.03;
}

// ==================== ★ Web 预览容器 ====================
// 生成 HTML 字符串（srcdoc 已转义），插入后需调用 bindWebResize 绑定拖拽
// ★ 关键修复：file:// 协议下 iframe 加载本地相对资源会报安全错误 →
//    1) 给 iframe 加 sandbox（静音该报错）
//    2) 把内容里的相对/同目录资源引用转为 about:blank，从源头避免请求
// ★ 权限放开：sandbox 只保留 allow-scripts 会导致 alert/confirm、表单、新窗口、
//    localStorage、下载等全部失效 → 放开常用权限，让网页代码在预览里完整可用
//   （内容为用户自己编辑器里的代码，属可信内容，故给予完整运行能力）
function webPreviewContainerHTML(codeContent){
    var safe = sanitizeSrcdocForFileProtocol(codeContent);
    return '<div class="web-preview-container" style="width:100%;height:400px;">' +
        '<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads allow-pointer-lock" srcdoc="' + escapeAttr(safe) + '" style="display:block;width:100%;height:100%;border:none;background:#fff;min-height:150px;"></iframe>' +
        '<div class="web-resize-handle"></div>' +
    '</div>';
}

// file:// 下把相对路径资源（./x、img.png、css/x.css 等）替换为 about:blank，避免安全报错
function sanitizeSrcdocForFileProtocol(html){
    if(location.protocol !== 'file:') return html;
    try {
        return String(html)
            // file: 绝对路径 → about:blank（file 协议下加载必报安全错误）
            .replace(/(\ssrc\s*=\s*")file:\/\/\/[^"]*(")/gi, '$1about:blank$2')
            .replace(/(\ssrc\s*=\s*')file:\/\/\/[^']*(')/gi, "$1about:blank$2")
            .replace(/(\shref\s*=\s*")file:\/\/\/[^"]*(")/gi, '$1about:blank$2')
            .replace(/(\shref\s*=\s*')file:\/\/\/[^']*(')/gi, "$1about:blank$2")
            // 相对路径资源 → about:blank
            .replace(/(\ssrc\s*=\s*")((?!https?:|data:|blob:|about:|\/\/)[^"]*)(")/gi, '$1about:blank$3')
            .replace(/(\ssrc\s*=\s*')((?!https?:|data:|blob:|about:|\/\/)[^']*)(')/gi, "$1about:blank$3")
            .replace(/(\shref\s*=\s*")((?!https?:|data:|blob:|about:|#|\/\/)[^"]*)(")/gi, '$1about:blank$3')
            .replace(/(\shref\s*=\s*')((?!https?:|data:|blob:|about:|#|\/\/)[^']*)(')/gi, "$1about:blank$3");
    } catch(e){ return html; }
}

// 给已插入 DOM 的 .web-preview-container 绑定右下角拖拽
function bindWebResize(container){
    if(container._resizeBound) return;
    container._resizeBound = true;
    var handle = container.querySelector('.web-resize-handle');
    if(!handle) return;
    var resizing = false, sx, sy, sw, sh;
    handle.addEventListener('mousedown', function(e2){
        e2.preventDefault();
        e2.stopPropagation();
        resizing = true;
        sx = e2.clientX; sy = e2.clientY;
        sw = container.offsetWidth; sh = container.offsetHeight;
        document.addEventListener('mousemove', onMM);
        document.addEventListener('mouseup', onMU);
    });
    function onMM(e2){
        if(!resizing) return;
        container.style.width  = Math.max(200, Math.min(window.innerWidth * 0.95, sw + e2.clientX - sx)) + 'px';
        container.style.height = Math.max(150, Math.min(window.innerHeight * 0.9, sh + e2.clientY - sy)) + 'px';
    }
    function onMU(){
        resizing = false;
        document.removeEventListener('mousemove', onMM);
        document.removeEventListener('mouseup', onMU);
    }
}

// 转义工具
function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){
    return escapeHtml(s).replace(/"/g,'&quot;');
}

// 渲染代码块为预览 HTML 字符串
function renderCodeBlockHTML(block){
    var lang = block.dataset.lang || 'text';
    var codeEl = block.querySelector('code');
    var codeText = codeEl ? codeEl.textContent : '';
    // 判定为网页预览：显式 html 语言，或以 < 开头且含闭合标签（避免 C++ #include <vector> 误判）
    var trimmed = codeText.trim();
    var looksHtml = /^</.test(trimmed) && /<\/[a-z][a-z0-9]*\s*>/i.test(trimmed);
    if(lang === 'html' || looksHtml){
        return webPreviewContainerHTML(codeText);
    }
    var cls = (lang && lang !== 'text') ? ' class="language-' + lang + '"' : '';
    return '<pre><code' + cls + '>' + escapeHtml(codeText) + '</code></pre>';
}

// ==================== ★ 预览生成（占位符方案：MD 与代码块彻底隔离） ★ ====================
// 思路：先把所有代码块换成纯文本占位符 → 整篇 turndown 转 MD → 清洗 → marked 解析
// → 再把占位符换回渲染好的代码块 HTML。代码块无论嵌套在哪都不会干扰 MD 识别。

// marked 全局配置（v4）：开启 GFM（表格/删除线等），禁用旧版换行模式
if(window.marked && marked.setOptions){
    marked.setOptions({ gfm: true, breaks: false, headerIds: false, mangle: false });
}

// ★ 围栏感知预处理（来自读写器）：只处理围栏外的文本，围栏内的 ASCII 图/代码原样保留
// 解决：大文档中 ``` 未闭合或紧贴前文 → 全部内容被当标题/表格解析、字号爆炸
function normalizeMarkdown(raw){
    var text = String(raw).replace(/\r\n/g, '\n');
    // 先把行首 ~~~ 围栏统一为 ```（仅在围栏外做）
    var segs = text.split('```');
    for(var i = 0; i < segs.length; i += 2){
        segs[i] = segs[i].replace(/^~~~/gm, '```');
    }
    text = segs.join('```');

    // 按 ``` 切分：偶数段在围栏外，奇数段在围栏内（围栏内绝不动）
    segs = text.split('```');
    for(var j = 0; j < segs.length; j += 2){
        var s = segs[j];
        s = s.replace(/^(\t+)/gm, function(m){ return '    '.repeat(m.length); }); // tab→空格
        s = s.replace(/^ {1,3}(?=\S)/gm, '');                                     // 行首 1-3 空格压掉（防缩进代码块）
        s = s.replace(/^(#{1,6})([^\s#])/gm, '$1 $2');                            // #标题 → # 标题
        s = s.replace(/^([-*+])([^\s\-*+>])/gm, '$1 $2');                         // -列表 → - 列表
        // ★ 分隔线前后强制空行（防止 --- 被当 setext 标题线或并入段落而显示原文）
        var ls = s.split('\n');
        var out = [];
        for(var li = 0; li < ls.length; li++){
            var L = ls[li];
            if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)){
                if(out.length && out[out.length-1].trim() !== '') out.push('');
                out.push(L.trim());
                if(li + 1 < ls.length && ls[li+1].trim() !== '') out.push('');
            } else { out.push(L); }
        }
        s = out.join('\n');
        segs[j] = s;
    }
    text = segs.join('```');

    // 围栏前必须有空行（否则 marked 把围栏并进段落 → 后续全部误解析）
    text = text.replace(/([^\n])\n```/g, '$1\n\n```');
    text = text.replace(/\n{4,}/g, '\n\n\n');
    if(!text.endsWith('\n')) text += '\n';
    return text;
}

// ★ 正文中自带的目录（"目录/TOC/Contents" 标题 + 锚点链接列表）不渲染在正文里
function isAnchorList(el){
    var links = el.querySelectorAll('a[href^="#"]');
    if(!links.length) return false;
    var items = el.querySelectorAll('li');
    if(items.length) return links.length >= Math.max(1, Math.ceil(items.length * 0.5));
    return (el.textContent || '').trim().length < 400;
}
function stripInlineTOC(root){
    var heads = Array.prototype.slice.call(root.querySelectorAll('h1,h2,h3,h4'));
    heads.forEach(function(h){
        var t = (h.textContent || '').replace(/[\s📑📋🔖]/g, '').toLowerCase();
        if(['目录','toc','contents','content','tableofcontents'].indexOf(t) === -1) return;
        // 若标题在正文容器内但容器本身是 stripTmp 根的直接子级没问题；只处理正文里的目录
        var node = h.nextSibling;
        var removedAny = false;
        while(node){
            if(node.nodeType === 1 && /^H[1-6]$/.test(node.tagName)) break;
            var next = node.nextSibling;
            var removable = false;
            if(node.nodeType === 3){ removable = !node.textContent.trim(); }
            else if(/^(UL|OL)$/.test(node.tagName)){ removable = isAnchorList(node); }
            else if(/^(P|DIV)$/.test(node.tagName)){ removable = isAnchorList(node); }
            if(removable){ node.parentNode.removeChild(node); removedAny = true; node = next; }
            else break;
        }
        if(removedAny && h.parentNode) h.parentNode.removeChild(h);
    });
}

// ★ mermaid 预渲染为 SVG（导出用，编辑器外无依赖时也能显示）
async function prerenderMermaidHTML(html){
    if(!window.mermaid) return html;
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var nodes = tmp.querySelectorAll('pre code.language-mermaid');
    for(var i = 0; i < nodes.length; i++){
        var pre = nodes[i].closest('pre');
        if(!pre) continue;
        try {
            var id = 'mmdx-' + Math.random().toString(36).slice(2);
            var out = await mermaid.render(id, nodes[i].textContent);
            var holder = document.createElement('div');
            holder.className = 'mermaid-diagram';
            holder.innerHTML = out.svg;
            pre.parentNode.replaceChild(holder, pre);
        } catch(e){ /* 保留原文 */ }
    }
    return tmp.innerHTML;
}

function generatePreviewHTML(){
    var clone = editor.cloneNode(true);
    // 0. 剔除浮动工具条等 UI 元素
    clone.querySelectorAll('.img-tool-popup').forEach(function(p){ p.remove(); });
    clone.querySelectorAll('.code-gutter').forEach(function(g){ g.remove(); }); // 行号栏是渲染期 UI

    // 0.5 ★ blob: URL 只在当前会话有效 → 用 RESOURCE_MAP 里的真实 data URL 替换
    clone.querySelectorAll('[data-res-ref]').forEach(function(el){
        var ref = el.getAttribute('data-res-ref');
        var res = RESOURCE_MAP.get(ref);
        if(res && res.data) el.setAttribute('src', res.data);
        el.removeAttribute('data-res-ref');
    });
    clone.querySelectorAll('[src^="blob:"]').forEach(function(el){ el.removeAttribute('src'); });

    // 1. 收集所有代码块（包括意外嵌套在 div 里的），替换为占位符
    var blocks = [];
    clone.querySelectorAll('.code-block').forEach(function(b){
        var idx = blocks.length;
        blocks.push(b);
        var ph = document.createElement('span');
        ph.textContent = '\n\nCBTOKEN' + idx + 'Z\n\n';
        b.parentNode.replaceChild(ph, b);
    });

    // 1.5 ★★ 核心：在任何字符串处理之前，把超长 base64 载荷抽成短占位符。
    //    之后 turndown / marked / 行处理全都只碰短文本，彻底避免大字符串正则回溯爆栈。
    //    ★ 不能用 setAttribute('src', token)：detached 元素改 src 也会立即发起加载请求
    //      （报错 PAYTOKEN0Z: Failed to load resource: net::ERR_FILE_NOT_FOUND）。
    //      改为移除 src + 自定义 data-paytoken 属性（不触发任何资源加载），
    //      还原时再把 data-paytoken 换回 src。
    var payloads = [];
    clone.querySelectorAll('img[src^="data:"], video[src^="data:"], audio[src^="data:"], source[src^="data:"]').forEach(function(el){
        var src = el.getAttribute('src');
        if(src && src.length > 2000){
            var idx = payloads.length;
            payloads.push(src);
            el.removeAttribute('src');
            el.setAttribute('data-paytoken', 'PAYTOKEN' + idx + 'Z');
        }
    });

    // 1.6 ★★ 解双重标记：元素已是标题/引用/列表，但文本里还带字面 MD 符号
    //    （如 h1 的文本是 "# 标题"、blockquote 的文本是 "> 内容"）→ 还原为纯文本行，
    //    交给 marked 重新正确解析，否则 turndown 再包一层会出现字面 # / > 残留。
    clone.querySelectorAll('h1,h2,h3,h4,h5,h6,blockquote').forEach(function(el){
        var t = (el.textContent || '').trim();
        if(/^(#{1,6}\s?|>\s?)/.test(t)){
            var d = document.createElement('div');
            d.textContent = t;
            el.parentNode.replaceChild(d, el);
        }
    });
    // 列表项文本自带字面列表符号（"- xx" / "1. xx"）→ 整个列表还原为纯文本行
    clone.querySelectorAll('ul,ol').forEach(function(list){
        var lis = list.querySelectorAll('li');
        if(!lis.length) return;
        var mdLike = 0;
        lis.forEach(function(li){
            if(/^\s*([-*+]\s|\d+\.\s)/.test(li.textContent || '')) mdLike++;
        });
        if(mdLike >= Math.ceil(lis.length * 0.6)){
            var frag = document.createDocumentFragment();
            lis.forEach(function(li){
                var d = document.createElement('div');
                d.textContent = (li.textContent || '').trim();
                frag.appendChild(d);
            });
            list.parentNode.replaceChild(frag, list);
        }
    });

    // 2. 整篇 HTML → Markdown
    var td = new TurndownService({
        headingStyle: 'atx',
        codeBlockStyle: 'fenced',
        bulletListMarker: '-'
    });

    // ★ 保留 span 及内联样式（选区字号/颜色），使预览与导出透传
    td.keep(['span']);

    // ★ 关键：不转义 ** 等 Markdown 符号（否则 **加粗** 变成 \*\* 无法解析）
    td.escape = function(s){ return s; };

    // ★ 媒体与图片原样透传（turndown 默认会丢弃 video/audio/iframe，图片会丢失 float/width 样式）
    td.addRule('mediaKeep', {
        filter: ['video', 'audio', 'iframe'],
        replacement: function(content, node){
            return '\n\n' + node.outerHTML + '\n\n';
        }
    });
    td.addRule('imgKeep', {
        filter: 'img',
        replacement: function(content, node){
            return node.outerHTML;
        }
    });

    var mdText = td.turndown(clone.innerHTML);
    mdText = normalizeMarkdown(mdText); // ★ 围栏感知预处理

    // 3. Markdown → HTML（加保护，个别极端输入不拖垮整个预览）
    var html;
    try {
        html = marked.parse(mdText);
    } catch(err){
        console.warn('marked 解析失败，回退纯文本展示', err);
        html = '<pre>' + escapeHtml(mdText) + '</pre>';
    }

    // 3.5 ★★ 还原 base64 载荷（split/join 不走正则，大字符串安全）
    //    ★ 必须在 stripTmp.innerHTML 之前执行：否则带占位符的 HTML 被浏览器解析时
    //      会发起无效资源请求；且必须带 data-paytoken=" 前缀精确匹配，
    //      避免误伤正文里字面出现的 "PAYTOKEN0Z" 等文本
    for(var p = 0; p < payloads.length; p++){
        html = html.split('data-paytoken="PAYTOKEN' + p + 'Z"').join('src="' + escapeAttr(payloads[p]) + '"');
    }

    // 3.2 ★ 剥掉正文自带的目录（目录只显示在目录面板里）
    var stripTmp = document.createElement('div');
    stripTmp.innerHTML = html;
    stripInlineTOC(stripTmp);
    html = stripTmp.innerHTML;

    // 4. 占位符换回渲染好的代码块（token 是纯字母数字，marked 不会破坏）
    for(var i = 0; i < blocks.length; i++){
        html = html.split('CBTOKEN' + i + 'Z').join(renderCodeBlockHTML(blocks[i]));
    }
    return html;
}

function pvBuildTOC(){
    pvTocList.innerHTML = '';
    var headings = previewContent.querySelectorAll('h1,h2,h3,h4');
    // ★ 过滤：正文目录标题、异常短标题、残留围栏符号不进目录

// ==================== ★ 智能识别预览 ====================
// 预览内容 = 智能识别结果（MD 文档识别 + 目录识别 + 布局排版），同时保留媒体与网页预览容器

// DOM 表格 → Markdown 表格文本（识别引擎据此识别并渲染，预览不丢表格）
function tableToMarkdown(tbl){
    var rows = [];
    tbl.querySelectorAll('tr').forEach(function(tr){
        var cells = [];
        tr.querySelectorAll('th, td').forEach(function(cd){
            cells.push(cd.textContent.trim().replace(/\s*\n\s*/g, ' ').replace(/\|/g, '\\|'));
        });
        if(cells.length) rows.push(cells);
    });
    if(!rows.length) return '';
    var lines = rows.map(function(r){ return '| ' + r.join(' | ') + ' |'; });
    var sep = '| ' + rows[0].map(function(){ return '---'; }).join(' | ') + ' |';
    lines.splice(1, 0, sep);   // 表头分隔行插在表头后
    return lines.join('\n');
}

// 提取媒体元素为占位符（返回其 outerHTML 列表），避免识别引擎破坏媒体
function collectPreviewMedia(root){
    var list = [];
    var els = root.querySelectorAll('img, video, audio, iframe, .web-preview-container');
    for(var i = 0; i < els.length; i++){
        var el = els[i];
        if(!el.parentNode) continue;                                            // 已被外层容器整体提取
        if(el.closest && el.closest('.web-preview-container')) continue;        // iframe 随容器一起提取
        // data-res-ref → 真实 data URL
        var ref = el.getAttribute('data-res-ref');
        if(ref){
            var res = RESOURCE_MAP.get(ref);
            if(res && res.data) el.setAttribute('src', res.data);
            el.removeAttribute('data-res-ref');
        }
        if((el.getAttribute('src') || '').indexOf('blob:') === 0) el.removeAttribute('src');
        // ★ file:// 唯一源下 iframe 空 src / file: / 相对路径会被解析为当前页面自身 → 报安全错误，
        //   统一替换为 about:blank 消除 "Unsafe attempt to load URL" 警告（http/data/blob 保留）
        if(el.tagName === 'IFRAME'){
            var fs = el.getAttribute('src') || '';
            if(!fs || /^file:/i.test(fs) || !/^(https?:|data:|blob:|about:|\/\/)/i.test(fs)){
                el.setAttribute('src', 'about:blank');
            }
        }
        var idx = list.length;
        list.push(el.outerHTML);
        var ph = document.createElement('span');
        ph.textContent = '\nMEDIA' + idx + 'Z\n';   // 前后换行 → 占位符独立成行，避免相邻媒体粘连
        el.parentNode.replaceChild(ph, el);
    }
    return list;
}

// 在渲染后的 DOM 里把占位符还原为真实媒体元素（DOM 级插入，避免被 <p> 包裹）
function restoreMediaToken(root, token, mediaHtml){
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(n){
        if(n.nodeValue.indexOf(token) === -1) return;
        var parts = n.nodeValue.split(token);
        var frag = document.createDocumentFragment();
        for(var i = 0; i < parts.length; i++){
            if(parts[i]) frag.appendChild(document.createTextNode(parts[i]));
            if(i < parts.length - 1){
                var d = document.createElement('div');
                d.innerHTML = mediaHtml;
                while(d.firstChild) frag.appendChild(d.firstChild);
            }
        }
        n.parentNode.replaceChild(frag, n);
    });
}

// 生成预览内容：智能识别 + 目录 + 媒体/网页容器保留
function buildSmartPreviewHTML(){
    var c = editor.cloneNode(true);
    c.querySelectorAll('.img-tool-popup').forEach(function(p){ p.remove(); });
    c.querySelectorAll('.code-gutter').forEach(function(g){ g.remove(); }); // 行号栏是渲染期 UI
    // ★ 选区样式透传：带 style 的 span（选区字号/颜色）先替换为唯一 token，
    //   纯文本提取不被破坏，marked 渲染后 split/join 还原回 span HTML
    var styleSpans = [];
    c.querySelectorAll('span[style]').forEach(function(sp, idx){
        if(!sp.textContent.trim()) return;
        if(sp.querySelector('span[style]')) return; // 只处理最外层 span（内层随外层整体还原）
        var token = 'SSTYLE' + idx + 'X';
        styleSpans.push({ token: token, html: sp.outerHTML });
        var tn = document.createTextNode(token);
        sp.parentNode.replaceChild(tn, sp);
    });
    // 表格 → Markdown 表格文本（让识别引擎正确识别并渲染，避免纯文本提取丢失表格结构）
    c.querySelectorAll('table').forEach(function(tbl){
        var mdTxt = tableToMarkdown(tbl);
        if(!mdTxt) return;
        // span 非块级 → 前后补空行，保证表格与相邻块（如代码围栏）正确分隔，避免粘连
        var frag = document.createDocumentFragment();
        frag.appendChild(document.createTextNode('\n\n'));
        frag.appendChild(document.createTextNode(mdTxt));
        frag.appendChild(document.createTextNode('\n\n'));
        tbl.parentNode.replaceChild(frag, tbl);
    });
    var mediaList = collectPreviewMedia(c);
    var raw = getCleanEditorText(true, c);        // 代码块围栏（带语言）→ 识别时原样保留
    var res = smartStructureText(raw);            // MD 识别：主标题/副标题/正文/表格/目录
    var html;
    try { html = marked.parse(normalizeMarkdown(res.md)); }
    catch(err){ html = '<pre>' + escapeHtml(res.md) + '</pre>'; }
    // ★ 还原选区样式（token → span outerHTML）
    for(var si = 0; si < styleSpans.length; si++){
        html = html.split(styleSpans[si].token).join(styleSpans[si].html);
    }
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    // 还原媒体（DOM 级插入）
    for(var i = 0; i < mediaList.length; i++) restoreMediaToken(tmp, 'MEDIA' + i + 'Z', mediaList[i]);
    // HTML 代码块 → 网页预览容器（保留「网页预览代码」能力）
    tmp.querySelectorAll('pre code.language-html').forEach(function(c2){
        var codeText = c2.textContent || '';
        var t = codeText.trim();
        if(/^</.test(t) && /<\/[a-z][a-z0-9]*\s*>|<[a-z][a-z0-9]*\s+[a-z-]+\s*=/i.test(t)){
            var wrap = document.createElement('div');
            wrap.innerHTML = webPreviewContainerHTML(codeText);
            var cont = wrap.firstElementChild;
            if(cont) c2.closest('pre').replaceWith(cont);
        }
    });
    return tmp.innerHTML;
}

// ==================== 保存与加载 ====================
function saveContent(){
    try {
        // ★ 序列化前处理：大媒体只留 data-res-ref，blob: URL 不落盘
        var c = editor.cloneNode(true);
        c.querySelectorAll('.img-tool-popup').forEach(function(p){ p.remove(); });
        c.querySelectorAll('.code-gutter').forEach(function(g){ g.remove(); }); // 行号栏不落盘
        c.querySelectorAll('[data-res-ref]').forEach(function(el){ el.removeAttribute('src'); });
        c.querySelectorAll('[src^="blob:"]').forEach(function(el){ el.removeAttribute('src'); });
        var html = c.innerHTML;

        // localStorage 只存小资源（大资源已在 IndexedDB）
        var resources = [];
        RESOURCE_MAP.forEach(function(res, id){
            if(res.data.length <= IDB_THRESHOLD){
                resources.push({ id: id, filename: res.filename, mimeType: res.mimeType, data: res.data });
            }
        });
        storageSet(STORAGE_KEY, JSON.stringify({ html: html, resources: resources }));
        updateCounts();
    } catch(e){
        // localStorage 满 → 去掉小资源的 data 兜底再试
        try {
            var c2 = editor.cloneNode(true);
            c2.querySelectorAll('.img-tool-popup').forEach(function(p){ p.remove(); });
            c2.querySelectorAll('.code-gutter').forEach(function(g){ g.remove(); }); // 行号栏不落盘
            c2.querySelectorAll('[data-res-ref]').forEach(function(el){ el.removeAttribute('src'); });
            c2.querySelectorAll('[src^="blob:"]').forEach(function(el){ el.removeAttribute('src'); });
            storageSet(STORAGE_KEY, JSON.stringify({ html: c2.innerHTML, resources: [] }));
        } catch(e2){}
    }
}

function loadContent(){
    var saved = storageGet(STORAGE_KEY);
    if(saved){
        try {
            var data = JSON.parse(saved);
            if(data.html) editor.innerHTML = data.html;
            if(data.resources){
                data.resources.forEach(function(r){
                    RESOURCE_MAP.set(r.id, { filename: r.filename, mimeType: r.mimeType, data: r.data });
                    if(parseInt(r.id) >= resourceCounter) resourceCounter = parseInt(r.id) + 1;
                });
            }
            setTimeout(function(){
                normalizeLoadedBlocks();
                var blocks = editor.querySelectorAll('.code-block');
                for(var i = 0; i < blocks.length; i++){ bindCodeBlockEvents(blocks[i]); }
                scheduleLineUpdate();
                // ★ 从 IndexedDB 恢复视频/音频/大图的 src
                restoreMediaRefs().then(function(){ scheduleLineUpdate(); });
            }, 200);
        } catch(e){}
    } else {
        editor.innerHTML = '<h1>欢迎使用智能编辑器</h1>' +
            '<p>可视化编辑器，<strong>代码块</strong>默认折叠（保留约10行），单击展开/折叠，双击编辑。</p>' +
            '<p>支持<strong>粘贴图片</strong>（自动缓存到本地），关闭页面再打开也不会丢失。</p>' +
            '<p>预览会自动识别并渲染<strong>Markdown</strong>，代码块与正文互不干扰。</p>';
        setTimeout(function(){ scheduleLineUpdate(); }, 100);
    }
    updateCounts();
}

// ==================== 选区字号调整（像 Word 一样，只作用于选中文字） ====================
function getSelectedRange(){
    var sel = window.getSelection();
    if(!sel || sel.rangeCount === 0) return null;
    var range = sel.getRangeAt(0);
    if(!range || range.collapsed) return null;
    return range;
}
function getSelectionBaseFontSize(){
    var sel = window.getSelection();
    var node = sel && sel.anchorNode;
    if(!node) return 15;
    // 元素节点也支持（重新选中字号 span 后 anchor 是 span 元素）
    var el = node.nodeType === 3 ? node.parentElement : node;
    if(el && el !== editor){
        var v = parseInt(getComputedStyle(el).fontSize, 10);
        if(v) return v;
    }
    // 退而取编辑器内第一个文本节点的实际字号
    var walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
    var tn = walker.nextNode();
    if(tn && tn.parentElement){
        var v2 = parseInt(getComputedStyle(tn.parentElement).fontSize, 10);
        if(v2) return v2;
    }
    return 15;
}
function applySelectionFontSize(delta){
    if(!getSelectedRange()){
        showToast('⚠️ 请先选中要调整字号的文字');
        editor.focus();
        return;
    }
    var base = getSelectionBaseFontSize();
    var target = Math.min(48, Math.max(9, base + delta));
    if(base + delta !== target){
        showToast(base + delta < 9 ? '⚠️ 已是最小字号 9px' : '⚠️ 已是最大字号 48px');
        return;
    }
    setSelectionFontSize(target);
}
function applySelectionFontSizeTo(target){
    target = Math.min(48, Math.max(9, parseInt(target, 10) || 15));
    if(!getSelectedRange()){
        showToast('⚠️ 请先选中要调整字号的文字');
        editor.focus();
        return;
    }
    setSelectionFontSize(target);
}
// 手动 Range 应用字号（不用 execCommand：execCommand 对已有 font-size 样式的文本第二次无效，
// 且无法精确指定 px。手动方案可重复连续调整，并保留选区便于继续操作）
function setSelectionFontSize(target){
    editor.focus();
    var sel = window.getSelection();
    if(!sel || sel.rangeCount === 0) return;
    var range = sel.getRangeAt(0);
    if(range.collapsed) return;
    // 0) 若选区位于旧字号 span 内，先把范围扩展到该 span 边界，避免反复操作产生嵌套
    expandRangeToFontSizeAncestors(range);
    // 1) 复制选区内容并清除旧字号标记（保留加粗/颜色等其他内联样式）
    var frag = range.cloneContents();
    cleanFontSizeInFragment(frag);
    // 2) 删除原文，插入带新字号的 span
    range.deleteContents();
    var span = document.createElement('span');
    span.style.fontSize = target + 'px';
    span.appendChild(frag);
    range.insertNode(span);
    // 3) 重新选中新内容，便于连续调整
    var nr = document.createRange();
    nr.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(nr);
    saveContent();
    scheduleLineUpdate();
    showToast('🔠 选中文字字号已设为 ' + target + 'px');
}
// 把选区边界扩展到最近带 font-size 内联样式的祖先 span（若存在），
// 这样连续调整字号时能覆盖并替换旧 span 而不是层层嵌套
function expandRangeToFontSizeAncestors(range){
    function findAncestor(node){
        var el = (node && node.nodeType === 3) ? node.parentElement : node;
        while(el && el !== editor){
            if(el.style && el.style.fontSize) return el;
            var disp = getComputedStyle(el).display;
            if(disp !== 'inline') break; // 遇到块级元素停止
            el = el.parentElement;
        }
        return null;
    }
    var sEl = findAncestor(range.startContainer);
    if(sEl && sEl.parentNode){
        // 范围覆盖到 span 元素本身（而不是其内部），这样 cloneContents 会包含 span，
        // cleanFontSizeInFragment 才能清理掉旧字号样式
        var sIdx = Array.prototype.indexOf.call(sEl.parentNode.childNodes, sEl);
        range.setStart(sEl.parentNode, sIdx);
    }
    var eEl = findAncestor(range.endContainer);
    if(eEl && eEl.parentNode){
        var eIdx = Array.prototype.indexOf.call(eEl.parentNode.childNodes, eEl) + 1;
        range.setEnd(eEl.parentNode, eIdx);
    }
}
function cleanFontSizeInFragment(frag){
    var els = [];
    var walker = document.createTreeWalker(frag, NodeFilter.SHOW_ELEMENT);
    while(walker.nextNode()) els.push(walker.currentNode);
    for(var i = 0; i < els.length; i++){
        var el = els[i];
        if(el.style && el.style.fontSize) el.style.fontSize = '';
        if(el.tagName === 'FONT' && el.getAttribute('size')) el.removeAttribute('size');
        // 无样式残留的 font/span 标签解包为纯文本
        if((el.tagName === 'FONT' || el.tagName === 'SPAN') &&
           (!el.getAttribute('size')) && (!el.style || el.style.length === 0) &&
           el.parentNode){
            while(el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
            el.parentNode.removeChild(el);
        }
    }
}

// ==================== 导出 ====================
function downloadFile(content, filename, mimeType){
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    showToast('📥 已导出 ' + filename);
}

function htmlToMarkdown(htmlStr){
    var td = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
    td.keep(['span']); // 保留内联样式（选区字号/颜色）
    td.addRule('codeBlock', {
        filter: function(node){ return node.classList && node.classList.contains('code-block'); },
        replacement: function(content, node){
            var lang = node.dataset.lang || 'text';
            var code = node.querySelector('code');
            return '```' + lang + '\n' + (code ? code.textContent : content) + '\n```';
        }
    });
    td.addRule('image', {
        filter: 'img',
        replacement: function(content, node){
            var alt = node.getAttribute('alt') || '';
            var src = node.getAttribute('src') || '';
            // 如果是 data URL 图片，在 MD 用占位
            if(src.indexOf('data:') === 0) return '![' + alt + '](图片)';
            return '![' + alt + '](' + src + ')';
        }
    });
    return td.turndown(htmlStr);
}

// ==================== ★ 导入 Markdown（来自读写器管线，直接可编辑） ====================
function importMarkdownToEditor(mdText, sourceName, forceMode){
    // 1. 预处理 → MD → HTML（与预览同管线，保证所见一致）
    var html;
    try { html = marked.parse(normalizeMarkdown(mdText)); }
    catch(e){ showToast('❌ Markdown 解析失败'); return; }

    var tmp = document.createElement('div');
    tmp.innerHTML = html;

    // 2. fenced 代码块 → 编辑器可视化代码块
    tmp.querySelectorAll('pre').forEach(function(pre){
        var codeEl = pre.querySelector('code');
        var lang = 'text';
        var codeText = '';
        if(codeEl){
            var m = (codeEl.className || '').match(/language-([\w+-]+)/);
            if(m) lang = m[1].toLowerCase();
            codeText = codeEl.textContent;
        } else {
            codeText = pre.textContent;
        }
        if(lang === 'mermaid') lang = 'text'; // mermaid 图以源码形式编辑
        var block = createCodeBlock(lang, codeText);
        pre.parentNode.replaceChild(block, pre);
    });

    // 3. 编辑器现有内容处理
    var hasContent = (editor.innerText || '').trim().length > 0 || editor.querySelector('img,video,.code-block');
    var mode = 'replace';
    if(forceMode === 'append' || forceMode === 'replace'){
        mode = forceMode;
    } else if(hasContent){
        mode = confirm('编辑器已有内容。\n\n「确定」= 追加到末尾\n「取消」= 替换全部内容') ? 'append' : 'replace';
    }
    if(mode === 'replace'){
        editor.innerHTML = '';
        RESOURCE_MAP.clear();
    }

    // 4. 移入编辑器
    var frag = document.createDocumentFragment();
    while(tmp.firstChild){ frag.appendChild(tmp.firstChild); }
    editor.appendChild(frag);

    // 5. 收尾：绑定代码块事件、保存、刷新行号
    setTimeout(function(){
        editor.querySelectorAll('.code-block').forEach(function(b){ bindCodeBlockEvents(b); });
        scheduleLineUpdate();
    }, 150);
    saveContent();
    showToast('✅ 已导入 Markdown' + (sourceName ? '：' + sourceName : '') + '（' + (mode === 'append' ? '追加' : '替换') + '）');
}

// ★ Ctrl+A：选区起点在代码块内时，只全选该代码块内容。
//   contenteditable 的默认行为是选中整个编辑区域（会连带正文），此处改为代码块局部全选。

            e.stopPropagation();
            var r = document.createRange();
            r.selectNodeContents(codeEl);
            var s = window.getSelection();
            s.removeAllRanges();
            s.addRange(r);
        }
    }
});

// ==================== ★ 智能识别：结构化目录生成 ====================
// 规则：识别已有 Markdown 标题 / 编号标题（1. 1.1 一、 第一章）/ 关键词章节 /
//       表格（| 分隔 或 "键：值"连续行）/ 列表 / 引用 / 代码围栏，
//       自动生成：主标题 → 副标题（章节编号重排）→ 正文 → 表格。
var SMART_HEADING_KEYWORDS = [
    '项目概览','项目简介','项目背景','项目目标','项目定位','技术栈','技术架构','技术选型','功能特性','核心功能','功能列表','功能说明',
    '系统架构','架构设计','设计思路','设计理念','设计原则','数据模型','模块说明','实现原理','运行流程','工作流程','业务流程',
    '安装','安装部署','快速开始','快速上手','使用说明','使用方法','操作指南','配置说明','配置项','接口文档','接口说明',
    'API','API 接口','界面预览','效果预览','运行效果','页面展示','注意事项','常见问题','FAQ','更新日志','版本记录','版本历史',
    '总结','结语','附录','免责声明','许可证','联系方式','目录','章节说明','文档说明','演示','案例分析','最佳实践','性能优化'
];
var SMART_VERB_RE = /^(?:打开|输入|点击|选择|设置|配置|运行|执行|安装|下载|上传|删除|添加|新增|修改|保存|复制|粘贴|按|使用|启动|停止|获取|提交|确认|填写|勾选|搜索|查找|导入|导出|切换|双击|单击|按下|查看|创建|生成|编辑|重命名|移动到|拖到|进入|退出|返回|跳转|关闭)/;
var SMART_HEAD_COUNT = 0;
var SMART_TABLE_COUNT = 0;

function smartExtractTitle(lines){
    var i, m;
    for(i = 0; i < Math.min(3, lines.length); i++){          // 0. 首行独立标题
        var l0 = lines[i].trim();
        if(!l0 || /[。！？!?；;]$/.test(l0)) continue;
        m = l0.match(/^(.{2,30}?)\s*[—\-–]\s*(程序框架文档|项目文档|使用文档|说明文档|技术文档|设计文档|需求文档|开发文档|白皮书|README|手册|文档|说明)$/i);
        if(m && m[1].length >= 2) return m[1].trim();
    }
    for(i = 0; i < lines.length; i++){                       // 1.「」书名号（文档名）
        m = lines[i].match(/「([^」]{2,30})」/);
        if(m) return m[1].trim();
    }
    for(i = 0; i < lines.length; i++){                       // 2. 《》
        m = lines[i].match(/《([^》]{2,30})》/);
        if(m){ var t = m[1].trim(); if(!/(系统|平台|游戏|产品)$/.test(t)) return t; }
    }
    for(i = 0; i < lines.length; i++){                       // 3. "XX是一款/是一个…" 句式
        m = lines[i].match(/^([^，。,。!?！？]{2,24}?)(?:是一款|是一个|是面向|作为一款|旨在|致力于|主要用于|实现了|提供)/);
        if(m && m[1].length >= 2) return m[1].trim();
    }
    for(i = 0; i < lines.length; i++){                       // 4. 首个 # 标题去编号
        var l = lines[i].trim();
        if(/^#/.test(l)) return l.replace(/^#+\s*/, '').replace(/^\d+(\.\d+)*\s*[、.．)）]\s*/, '').trim();
    }
    for(i = 0; i < lines.length; i++){                       // 5. 首个关键词章节行
        var l2 = lines[i].trim();
        for(var j = 0; j < SMART_HEADING_KEYWORDS.length; j++){
            if(l2 === SMART_HEADING_KEYWORDS[j] || l2.indexOf(SMART_HEADING_KEYWORDS[j] + '：') === 0 || l2.indexOf(SMART_HEADING_KEYWORDS[j] + ':') === 0) return '文档';
        }
    }
    return '';
}

function smartNumHeading(line){
    // 编号标题："1. 项目概览" "1.1 项目简介" "1.1.1 说明"；中文编号："一、" "（一）" "第一章"
    var m = line.match(/^(\d+(?:\.\d+){0,3})\s*(?:[、.．)）]\s*)?(\S.*)$/);
    if(m){
        var text = m[2].trim();
        // 长句不判标题（正文段落）
        if(text.length > 25) return null;
        // 关键词（使用说明/安装部署/配置说明…）优先判为标题，不受动词表影响
        if(smartKeywordHeading(text)) return { num: m[1], text: text, level: Math.min(4, m[1].split('.').length + 1) };
        // 动词开头 → 操作步骤列表，不判标题
        if(SMART_VERB_RE.test(text)) return null;
        var depth = m[1].split('.').length;
        return { num: m[1], text: text, level: Math.min(4, depth + 1) };
    }
    var c = line.match(/^[（(]?([一二三四五六七八九十百]+)[）)、.．]\s*(\S.*)$/);
    if(c) return { num: '', text: c[2], level: 2 };
    var ch = line.match(/^第([一二三四五六七八九十百\d]+)[章节部分]\s*[:：]?\s*(\S.*)$/);
    if(ch) return { num: '', text: ch[2], level: 2 };
    return null;
}

function smartKeywordHeading(line){
    var t = line.trim().replace(/^[#>*]+\s*/, '').replace(/[：:]\s*$/, '');
    if(!t || t.length > 14) return null;
    for(var i = 0; i < SMART_HEADING_KEYWORDS.length; i++){
        if(t === SMART_HEADING_KEYWORDS[i]) return t;
    }
    return null;
}

function smartKVTable(lines){
    // 连续 "键：值" 行 → 两列表格（键 1-14 字符、值 ≤ 60 字符、均不以句末标点结尾）
    var rows = [];
    for(var i = 0; i < lines.length; i++){
        var t = lines[i].trim();
        if(t === '') return null;
        var m = t.match(/^(.{1,14}?)[：:]\s*(.+)$/);
        if(!m) return null;
        var key = m[1].trim(), val = m[2].trim();
        if(/[。！？!?；;]$/.test(key)) return null;
        if(!/^[\u4e00-\u9fa5A-Za-z]/.test(key)) return null;
        if(val.length > 60 || /[。！？!?；;]$/.test(val)) return null;
        rows.push([key, val]);
    }
    return rows.length >= 2 ? rows : null;
}

function smartIsTocTitle(text){
    var t = String(text || '').replace(/[\s_\-:：]/g, '').toLowerCase();
    return ['目录','目錄','toc','contents','content','tableofcontents'].indexOf(t) !== -1;
}

function smartStructureText(raw, dbg){
    var lines = String(raw || '').replace(/\r\n/g, '\n').split('\n');
    var title = smartExtractTitle(lines);
    var titleSkip = -1;
    if(title){
        var tlEsc = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        for(var ti = 0; ti < Math.min(3, lines.length); ti++){
            var tl0 = lines[ti].trim();
            if(tl0 === title || new RegExp('^' + tlEsc + '\\s*[—\\-–]').test(tl0)){ titleSkip = ti; break; }
        }
    }
    var out = [], pending = [], pendingLn = [], tableBuf = [], numPath = [0, 0, 0];
    var inFence = false, headings = 0, tables = 0, tocMode = false;
    // 逐行诊断：dbg 可选，格式 { ln, kind, note }，ln 从 1 开始
    function dSet(ln, kind, note){
        if(!dbg) return;
        for(var k = 0; k < dbg.length; k++){ if(dbg[k].ln === ln){ dbg[k].kind = kind; dbg[k].note = note || dbg[k].note; return; } }
        dbg.push({ ln: ln, kind: kind, note: note || '' });
    }
    function dAdd(ln, kind, note){ if(dbg) dbg.push({ ln: ln, kind: kind, note: note || '' }); }
    function curLn(){ return i + 1; }

    function bump(level){
        numPath[level - 2]++;
        for(var i = level - 1; i < 3; i++) numPath[i] = 0;
        return numPath.slice(0, level - 1);
    }
    function setNum(numStr){
        var pp = String(numStr).split('.').map(function(s){ return parseInt(s, 10) || 0; });
        for(var i = 0; i < pp.length; i++) numPath[i] = pp[i];
        for(var j = pp.length; j < 3; j++) numPath[j] = 0;
    }
    function fmtNum(parts){
        var s = parts.join('.');
        if(parts.length === 1) s += '.';
        return s + ' ';
    }
    function emitHeading(level, text, numStr){
        var prefix = '';
        if(numStr){
            setNum(numStr);
            prefix = fmtNum(numStr.split('.').map(function(s){ return parseInt(s, 10) || 0; }));
        } else if(level >= 2){
            prefix = fmtNum(bump(level));
        }
        out.push('#'.repeat(level) + ' ' + prefix + text.trim());
        headings++;
    }
    function flushPending(){
        if(!pending.length) return;
        var kv = smartKVTable(pending);
        if(kv){
            out.push('| 项目 | 内容 |');
            out.push('|------|------|');
            kv.forEach(function(r){ out.push('| ' + r[0] + ' | ' + r[1] + ' |'); });
            tables++;
            pendingLn.forEach(function(ln){ dSet(ln, 'table', '键值行 → 两列表格'); });
        } else {
            var allList = pending.every(function(l){
                var t = l.trim();
                return /^[-*+]\s+\S/.test(t) || /^\d+[、.)]\s+\S/.test(t);
            });
            if(allList){
                pending.forEach(function(l){ out.push(l.trim()); });
                pendingLn.forEach(function(ln){ dSet(ln, 'list', '列表'); });
            } else if(pending.some(function(l){ return /[\u2500-\u257f]/.test(l); })){
                pending.forEach(function(l){ out.push(l); });    // ASCII/制表符图形块：保持原行连续输出
                pendingLn.forEach(function(ln){ dSet(ln, 'ascii', 'ASCII 图形块：原样连续输出'); });
            } else {
                out.push(pending.map(function(l){ return l.trim(); }).join('\n\n'));
                pendingLn.forEach(function(ln){ dSet(ln, 'text', '正文段落'); });
            }
        }
        pending = [];
        pendingLn = [];
    }
    function flushTable(){
        if(!tableBuf.length) return;
        out.push(tableBuf.map(function(l){ return l.trim(); }).join('\n'));
        tables++;
        tableBuf = [];
    }

    for(var i = 0; i < lines.length; i++){
        var line = lines[i];
        if(i === titleSkip){ dAdd(curLn(), 'skip', '主标题原文行：提取后跳过'); continue; }
        var t = line.trim();
        if(/^```/.test(t) || /^~~~/.test(t)){                    // 代码围栏（``` / ~~~ 均翻转状态）
            flushPending(); flushTable();
            out.push(line);
            dAdd(curLn(), 'meta', inFence ? '代码围栏结束' : '代码围栏开始');
            inFence = !inFence;
            continue;
        }
        if(inFence){ out.push(line); dAdd(curLn(), 'code', '代码行（围栏内原样保留）'); continue; }

        if(t === ''){ tocMode = false; flushPending(); flushTable(); out.push(''); dAdd(curLn(), 'blank', '空行'); continue; }

        if(/^\s*\|.*\|\s*$/.test(t)){                            // 表格（| 分隔）
            if(pending.length) flushPending();
            tableBuf.push(t);
            dAdd(curLn(), 'table', '表格行');
            continue;
        }
        flushTable();

        var md = t.match(/^(#{1,6})\s+(.*)$/);                   // Markdown 标题
        if(md){
            flushPending();
            var lv = md[1].length;
            var txt = md[2].trim();
            if(lv === 1){
                out.push('# ' + txt);
                headings++;
                dAdd(curLn(), 'head', '主标题（#）');
            } else if(smartIsTocTitle(txt)){
                out.push('#'.repeat(lv) + ' ' + txt);
                headings++;
                tocMode = true;
                dAdd(curLn(), 'toc', '目录标题：后续编号行保持列表');
            } else {
                var nm = txt.match(/^(\d+(?:\.\d+){0,3})\s*(?:[、.．)）]\s*)?(.+)$/);
                if(nm){ emitHeading(Math.max(lv, 2), nm[2], nm[1]); dAdd(curLn(), 'head', '标题（## 等，保留原编号）'); }
                else { emitHeading(lv, txt, ''); dAdd(curLn(), 'head', '标题（## 等，自动编号）'); }
            }
            continue;
        }

        var nh = smartNumHeading(t);                             // 编号标题（无 # 标记）
        if(tocMode){                                             // 目录模式：编号/列表行保持列表
            if(/^\d+(?:\.\d+){0,3}\s*[、.．)）]\s*\S/.test(t) || /^[-*+]\s+\S/.test(t)){ pending.push(t); pendingLn.push(curLn()); dAdd(curLn(), 'toc', '目录条目：保持列表'); continue; }
            tocMode = false;
        }
        if(nh){
            flushPending();
            emitHeading(nh.level, nh.text, nh.num);
            dAdd(curLn(), 'head', '编号标题 → 自动编号 ' + fmtNum(numPath.slice(0, nh.level - 1)));
            continue;
        }

        var kw = smartKeywordHeading(t);                         // 关键词章节
        if(kw){
            flushPending();
            if(smartIsTocTitle(kw)){ out.push('## ' + kw); headings++; tocMode = true; dAdd(curLn(), 'toc', '目录标题'); }
            else { emitHeading(2, kw, ''); dAdd(curLn(), 'head', '关键词章节 → ## 标题'); }
            continue;
        }

        if(/^>\s?/.test(t)){ flushPending(); out.push(t); dAdd(curLn(), 'meta', '引用块'); continue; }
        if(/^\s*([-*_])\1{2,}\s*$/.test(t)){ tocMode = false; flushPending(); out.push('---'); dAdd(curLn(), 'meta', '分隔线 → ---'); continue; }
        if(/^[-*+]\s+\S/.test(t) || /^\d+[、.)]\s+\S/.test(t)){ pending.push(t); pendingLn.push(curLn()); dAdd(curLn(), 'list', '列表行'); continue; }
        pending.push(t); pendingLn.push(curLn()); dAdd(curLn(), 'pending', '待定（正文/键值/图形块）');   // 正文
    }
    flushPending(); flushTable();

    if(title && !/^#\s/.test(out[0] || '')){                     // 智能主标题
        out.unshift('# ' + title, '');
        if(dbg) dbg.push({ ln: 0, kind: 'head', note: '智能提取主标题 → # ' + title });
    }
    var md = out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    SMART_HEAD_COUNT = headings;
    SMART_TABLE_COUNT = tables;
    return { md: md, title: title, headings: headings, tables: tables };
}

        editor.innerHTML = '';

        idbClear().catch(function(){}); // ★ 同时清空大文件缓存
        showToast('🗑️ 已清空');
        updateCounts(); renderLineNumbers();
    }
});

// ==================== 启动 ====================
loadContent();
currentMode = modeSelect.value;
renderLineNumbers();
console.log('🚀 智能编辑器 v3 已启动');
})();
