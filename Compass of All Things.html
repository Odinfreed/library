<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>万象罗盘 & 八字四柱</title>
    <style>
        :root {
            --bg: #0a0f0a;
            --green-neon: #00ffcc;
            --green-dark: #00aa7f;
            --green-glow: #33ffaa;
            --panel-bg: rgba(5, 15, 10, 0.95);
            --border-green: rgba(0, 255, 200, 0.5);
            --text: #ccffdd;
            --text-dim: #5a8f7a;
            --text-bright: #e0ffee;
            --wood: #2ecc71; --fire: #e74c3c; --earth: #f1c40f; --metal: #bdc3c7; --water: #3498db;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Noto Serif SC', 'KaiTi', monospace;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 10px; overflow-x: hidden;
        }
        .app-container { width: 100%; max-width: 650px; display: flex; flex-direction: column; align-items: center; }
        .tab-buttons { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .tab-btn {
            background: rgba(0,255,200,0.15); border: 1px solid var(--border-green);
            color: var(--green-neon); padding: 8px 18px; border-radius: 20px;
            font-size: 0.9rem; cursor: pointer; white-space: nowrap;
        }
        .tab-btn.active { background: rgba(0,255,200,0.4); color: #fff; }
        .panel { display: none; flex-direction: column; align-items: center; width: 100%; }
        .panel.active { display: flex; }

        .canvas-wrapper {
            position: relative; width: min(100%, 75vw); aspect-ratio: 1/1; border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,255,200,0.3); overflow: hidden;
            background: radial-gradient(circle, #0a1a12 0%, #030a06 100%);
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .info-bar {
            margin-top: 8px; font-size: 0.7rem; color: var(--text);
            background: rgba(0,30,20,0.6); padding: 8px 12px 8px 12px; border-radius: 20px;
            width: 100%; position: relative; line-height: 1.4; min-height: 60px;
            user-select: text; -webkit-user-select: text;
        }
        .info-bar .line2 { color: var(--text-dim); font-size: 0.65rem; margin-top: 4px; }
        .info-bar .line3 { color: var(--green-glow); font-size: 0.65rem; margin-top: 2px; }
        .info-buttons {
            position: absolute; right: 8px; top: 8px;
            display: flex; gap: 4px;
        }
        .info-btn {
            background: rgba(0,255,200,0.2); border: 1px solid var(--border-green);
            color: var(--green-neon); padding: 2px 8px; border-radius: 8px;
            font-size: 0.6rem; cursor: pointer;
        }
        .hamburger-btn {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0,20,15,0.8); border: 1px solid var(--border-green);
            color: var(--green-neon); font-size: 1.6rem; width: 42px; height: 42px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .control-panel {
            position: fixed; top: 0; left: -290px; width: 270px; height: 100%;
            background: var(--panel-bg); border-right: 1px solid var(--border-green);
            backdrop-filter: blur(12px); padding: 18px 14px; color: var(--text);
            font-size: 0.8rem; transition: left 0.3s; z-index: 999; overflow-y: auto;
        }
        .control-panel.open { left: 0; }
        .control-panel h3 { color: var(--green-neon); text-align: center; margin-bottom: 14px; font-size: 1.2rem; border-bottom: 1px solid var(--border-green); padding-bottom: 6px; }
        .layer-list { display: flex; flex-direction: column; gap: 7px; }
        .layer-item { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 6px; border-radius: 5px; }
        .layer-item:hover { background: rgba(0,255,200,0.1); }
        .layer-item input[type="checkbox"] { accent-color: var(--green-neon); width: 15px; height: 15px; }
        .layer-item label { cursor: pointer; flex: 1; font-size: 0.8rem; color: var(--text); }
        .btn-row { display: flex; gap: 8px; margin: 12px 0; justify-content: center; flex-wrap: wrap; }
        .btn { background: rgba(0,255,200,0.15); border: 1px solid var(--border-green); color: var(--green-neon); padding: 5px 12px; border-radius: 16px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
        .btn.reset { background: rgba(255,100,100,0.2); border-color: rgba(255,150,150,0.6); color: #ff9999; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index:998; display:none; }
        .overlay.show { display:block; }

        /* 八字面板 */
        .bazi-container {
            width: 100%; background: var(--panel-bg); border-radius: 16px; padding: 20px;
            border: 1px solid var(--border-green); color: var(--text);
        }
        .bazi-container h3 { color: var(--green-neon); text-align: center; margin-bottom: 14px; font-size: 1.2rem; }
        .bazi-inputs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; justify-content: center; }
        .bazi-inputs input, .bazi-inputs select {
            background: #0a1a12; border: 1px solid var(--border-green); color: var(--text);
            padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-family: inherit;
        }
        .bazi-inputs input:focus { outline: none; border-color: var(--green-glow); box-shadow: 0 0 8px rgba(0,255,200,0.2); }
        .bazi-btn {
            background: rgba(0,255,200,0.2); border: 1px solid var(--border-green);
            color: var(--green-neon); padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-size: 0.8rem; font-family: inherit;
        }
        .bazi-btn:hover { background: rgba(0,255,200,0.4); color: #fff; }
        .bazi-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.8rem; }
        .bazi-table th, .bazi-table td { border: 1px solid var(--border-green); padding: 6px; text-align: center; color: var(--text); }
        .bazi-table th { background: rgba(0,255,200,0.15); color: var(--green-neon); }
        .bazi-detail { background: rgba(0,30,20,0.6); border-radius: 12px; padding: 16px; border: 1px solid var(--border-green); font-size: 0.85em; line-height: 1.7; color: var(--text); margin-bottom: 12px; }
        .bazi-summary { background: rgba(0,100,80,0.15); border-left: 4px solid var(--green-neon); border-radius: 12px; padding: 18px 20px; margin: 16px 0; font-size: 0.9em; line-height: 1.8; color: var(--text); }
        .bazi-summary strong { color: var(--green-glow); }
        .bazi-tag { display: inline-block; background: rgba(0,255,200,0.15); border-radius: 6px; padding: 2px 8px; margin: 2px 3px; font-size: 0.9em; border: 1px solid var(--border-green); }
        .bazi-highlight { color: var(--green-glow); font-weight: 700; }
        .bazi-error { background: rgba(255,80,80,0.15); color: #ff9999; border: 1px solid rgba(255,100,100,0.5); border-radius: 10px; padding: 12px 16px; margin-top: 12px; font-size: 0.85em; text-align: center; display: none; }
        .bazi-error.show { display: block; }
        .bazi-koujue { background: rgba(0,100,80,0.2); border-left: 4px solid var(--green-neon); padding: 12px 18px; border-radius: 8px; margin: 12px 0; font-family: "KaiTi","楷体",serif; font-size: 0.85em; color: var(--text); line-height: 1.8; white-space: pre-wrap; }
        .bazi-wuxing-bar { display: flex; gap: 6px; align-items: flex-end; height: 80px; margin: 10px 0; border-bottom: 1px solid rgba(0,255,200,0.3); }
        .bazi-wuxing-item { flex: 1; text-align: center; font-size: 0.75em; color: var(--text); }
        .bazi-wuxing-fill { width: 100%; border-radius: 4px 4px 0 0; transition: height 0.4s; }
        .bazi-wuxing-label { margin-top: 4px; font-weight: 600; }
        .bazi-details { background: rgba(0,30,20,0.5); border: 1px solid var(--border-green); border-radius: 12px; padding: 4px 18px; margin-bottom: 8px; }
        .bazi-details summary { font-weight: 700; font-size: 0.95em; color: var(--green-neon); cursor: pointer; padding: 12px 0; list-style: none; display: flex; align-items: center; justify-content: space-between; }
        .bazi-details summary::after { content: '▸'; font-size: 0.8em; transition: transform 0.2s; }
        .bazi-details[open] summary::after { transform: rotate(90deg); }
        .bazi-result-area { display: none; }
        .bazi-result-area.show { display: block; }
        .bazi-shensha-table { width: 100%; border-collapse: collapse; font-size: 0.75em; margin: 10px 0; }
        .bazi-shensha-table th, .bazi-shensha-table td { border: 1px solid var(--border-green); padding: 5px 6px; text-align: center; color: var(--text); background: rgba(0,30,20,0.5); }
        .bazi-shensha-table th { background: rgba(0,255,200,0.15); color: var(--green-neon); }
        .bazi-note { font-size: 0.72em; color: var(--text-dim); text-align: center; margin-top: 14px; line-height: 1.5; }
        /* AI 推演面板 */
        .ai-container { width: 100%; background: var(--panel-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-green); color: var(--text); }
        .ai-container h3 { color: var(--green-neon); text-align: center; margin-bottom: 14px; font-size: 1.2rem; }
        .ai-input-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
        .ai-input-group label { font-size: 0.8rem; color: var(--text-dim); min-width: 70px; }
        .ai-input-group input, .ai-input-group select { flex: 1; min-width: 140px; background: #0a1a12; border: 1px solid var(--border-green); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-family: inherit; }
        .ai-input-group input:focus, .ai-input-group select:focus { outline: none; border-color: var(--green-glow); box-shadow: 0 0 8px rgba(0,255,200,0.2); }
        .ai-output { background: rgba(0,30,20,0.6); border-radius: 12px; padding: 16px; border: 1px solid var(--border-green); font-size: 0.85em; line-height: 1.7; color: var(--text); min-height: 200px; white-space: pre-wrap; max-height: 60vh; overflow-y: auto; }
        .ai-output .reasoning { color: var(--text-dim); border-left: 3px solid var(--green-dark); padding-left: 10px; margin-bottom: 12px; font-size: 0.9em; }
        .ai-output .reasoning p { margin-bottom: 6px; }
        .ai-output .answer { color: var(--text-bright); }
        .ai-output h1, .ai-output h2, .ai-output h3, .ai-output h4, .ai-output h5, .ai-output h6 { color: var(--green-neon); margin: 12px 0 8px; font-weight: 700; }
        .ai-output h1 { font-size: 1.25em; }
        .ai-output h2 { font-size: 1.15em; }
        .ai-output h3 { font-size: 1.05em; }
        .ai-output p { margin-bottom: 10px; }
        .ai-output ul, .ai-output ol { margin: 8px 0 10px 20px; }
        .ai-output li { margin-bottom: 4px; }
        .ai-output strong { color: var(--green-glow); font-weight: 700; }
        .ai-output em { color: var(--text-bright); font-style: italic; }
        .ai-output pre { background: rgba(0,20,15,0.9); border: 1px solid var(--border-green); border-radius: 8px; padding: 10px; margin: 10px 0; overflow-x: auto; }
        .ai-output code { font-family: 'Fira Code', 'Consolas', monospace; background: rgba(0,40,30,0.6); padding: 2px 5px; border-radius: 4px; color: var(--green-glow); }
        .ai-output pre code { background: transparent; padding: 0; color: var(--text); }
        .ai-status { font-size: 0.75rem; color: var(--green-glow); text-align: center; margin-top: 8px; min-height: 1.2em; }
        .ai-btn { background: rgba(0,255,200,0.2); border: 1px solid var(--border-green); color: var(--green-neon); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-family: inherit; width: 100%; margin-top: 8px; }
        .ai-btn:hover { background: rgba(0,255,200,0.4); color: #fff; }
        .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .ai-tip { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 10px; text-align: center; line-height: 1.5; }
        .ai-reasoning-details {
            background: rgba(0,30,20,0.4); border: 1px solid var(--border-green); border-radius: 10px;
            padding: 10px 14px; margin-bottom: 12px; cursor: pointer;
        }
        .ai-reasoning-details summary {
            color: var(--green-neon); font-weight: 600; list-style: none;
            display: flex; align-items: center; gap: 6px;
        }
        .ai-reasoning-details summary::after { content: '▸'; font-size: 0.8em; transition: transform 0.2s; }
        .ai-reasoning-details[open] summary::after { transform: rotate(90deg); }
        .ai-reasoning-details .reasoning {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid rgba(0,255,200,0.2);
            color: var(--text-dim); border-left: none; padding-left: 0; margin-bottom: 0;
        }

        @media (min-width:768px) and (max-width:1149px) {
            body { align-items: flex-start; padding: 24px 18px; gap: 16px; }
            .hamburger-btn { display:none; }
            .control-panel { position:relative; left:0; width:220px; height:auto; border-right:none; border-radius:14px; margin-top:0; align-self:flex-start; }
            .app-container { flex-direction:column; gap:16px; align-items:center; max-width:900px; flex:1; }
            #tabLuopan { display: none; }
            #panelLuopan { display: flex !important; }
            .tab-buttons { justify-content: flex-start; margin-bottom: 8px; }
            .canvas-wrapper { width: 620px; max-width: 620px; }
            .info-bar { max-width: 720px; }
            .bazi-container, .ai-container { width: 100%; max-width: 760px; }
            .ai-output { max-height: 70vh; }
        }
        @media (min-width:1150px) {
            body { align-items: flex-start; padding: 20px 18px; gap: 18px; }
            .hamburger-btn { display:none; }
            .control-panel { position:relative; left:0; width:240px; height:auto; border-right:none; border-radius:14px; margin-top:0; align-self:flex-start; }
            .app-container {
                display: grid;
                grid-template-columns: 620px 1fr;
                grid-template-rows: auto 1fr;
                grid-template-areas:
                    "luopan tabs"
                    "luopan content";
                gap: 20px; max-width: 1400px; flex: 1; align-items: start;
            }
            #tabLuopan { display: none; }
            .tab-buttons { grid-area: tabs; justify-content: flex-start; margin-bottom: 0; }
            .tab-btn { padding: 10px 22px; font-size: 1rem; }
            #panelLuopan { grid-area: luopan; display: flex !important; }
            #panelBazi, #panelAI { grid-area: content; align-items: flex-start; }
            .canvas-wrapper { width: 100%; max-width: 620px; }
            .info-bar { max-width: 100%; }
            .bazi-container, .ai-container { width: 100%; max-width: 100%; margin: 0; }
            .ai-output { max-height: 75vh; }
        }
    </style>
</head>
<body>
<div class="hamburger-btn" id="menuBtn">☰</div>
<div class="overlay" id="overlay"></div>
<div class="control-panel" id="controlPanel">
    <h3>☯ 图层筛选</h3>
    <div class="btn-row">
        <button class="btn" id="btnDynamic">📡 动态排盘：关</button>
        <button class="btn" id="btnClock">🕰️ 钟表形态：关</button>
        <button class="btn reset" id="btnReset">↺ 恢复默认</button>
    </div>
    <div class="layer-list" id="layerList"></div>
    <div class="btn-row" style="margin-top:10px;">
        <button class="btn" id="btnSelectAll">全选</button>
        <button class="btn" id="btnDeselectAll">全不选</button>
    </div>
    <div class="btn-row" style="margin-top:6px;">
        <button class="btn" id="btnCopyAll">📋 一键复制全部</button>
    </div>
    <div style="margin-top:10px; font-size:0.7rem; color:var(--text-dim); text-align:center;">
        <span style="color:#2ecc71">●木</span> <span style="color:#e74c3c">●火</span> <span style="color:#f1c40f">●土</span> <span style="color:#bdc3c7">●金</span> <span style="color:#3498db">●水</span><br>
        点击环选中，拖动旋转
    </div>
</div>

<div class="app-container">
    <div class="tab-buttons">
        <button class="tab-btn active" id="tabLuopan">🕰️ 奇门罗盘</button>
        <button class="tab-btn" id="tabBazi">📅 八字四柱</button>
        <button class="tab-btn" id="tabAI">🤖 AI推演</button>
    </div>

    <div class="panel active" id="panelLuopan">
        <div style="margin-bottom:8px;"><button class="btn" id="authBtn">📍 开启定位与指南针</button></div>
        <div class="canvas-wrapper" id="canvasWrapper"><canvas id="luopanCanvas"></canvas></div>
        <div class="info-bar" id="infoBar">
            <div class="line1">📡 等待传感器… | ⚙️ 静态模式</div>
            <div class="info-buttons">
                <button class="info-btn" id="copyInfoBtn">📋</button>
                <button class="info-btn" id="exportAllBtn">🌐</button>
            </div>
        </div>
    </div>

    <div class="panel" id="panelBazi">
        <div class="bazi-container">
            <h3>☯ 八字四柱推算</h3>
            <div class="bazi-inputs">
                <input type="date" id="baziDate" value="2026-07-28" />
                <input type="time" id="baziTime" value="01:47" step="60" />
                <select id="baziGender">
                    <option value="">性别</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
                <button class="bazi-btn" id="baziCalcBtn">🔮 推算四柱</button>
                <button class="bazi-btn" id="baziNowBtn">📍 此刻</button>
                <button class="bazi-btn" id="baziClearBtn">✕ 清空</button>
            </div>
            <div class="bazi-error" id="baziError"></div>
            <div class="bazi-result-area" id="baziResultArea">
                <table class="bazi-table" id="baziPillarsTable"></table>
                <div class="bazi-detail" id="baziDetailBox"></div>
                <div class="bazi-summary" id="baziSummaryBox"></div>
                <button class="bazi-btn" id="baziCopyBtn" style="width:100%;">📋 一键复制结果（含总结）</button>
                <details class="bazi-details" open>
                    <summary>🧘 十神分析</summary>
                    <div id="baziShiShenContent"></div>
                </details>
                <details class="bazi-details" open>
                    <summary>✨ 神煞分析（十八神煞）</summary>
                    <div id="baziShenShaContent"></div>
                </details>
                <details class="bazi-details" open>
                    <summary>🌿 五行分布</summary>
                    <div id="baziWuXingContent"></div>
                </details>
                <details class="bazi-details">
                    <summary>📜 完整口诀</summary>
                    <div class="bazi-koujue" id="baziKouJueAll"></div>
                </details>
            </div>
            <p class="bazi-note">⚠ 年柱以立春为界 · 月柱以节气为界 · 时柱以五鼠遁推算 · 23时后算次日</p>
        </div>
    </div>

    <div class="panel" id="panelAI">
        <div class="ai-container">
            <h3>🤖 时空命盘 AI 推演</h3>
            <div class="ai-input-group">
                <label>DeepSeek API Key</label>
                <input type="password" id="aiApiKey" placeholder="sk-..." />
                <button class="bazi-btn" id="aiSaveKeyBtn">💾 保存密钥</button>
            </div>
            <div class="ai-input-group">
                <label>模型</label>
                <select id="aiModel">
                    <option value="deepseek-v4-pro">deepseek-v4-pro（思考模式）</option>
                    <option value="deepseek-reasoner">deepseek-reasoner</option>
                    <option value="deepseek-chat">deepseek-chat</option>
                </select>
            </div>
            <div class="ai-input-group">
                <label>推理强度</label>
                <select id="aiReasoning">
                    <option value="high">high</option>
                    <option value="medium">medium</option>
                    <option value="low">low</option>
                </select>
            </div>
            <p class="ai-tip">
                将当前奇门罗盘状态与八字四柱结果融合，请求 DeepSeek AI 进行今日运势时空推演。<br>
                ⚠ 浏览器直接调用 API 可能受 CORS 限制，如遇失败请在本地启用代理服务。
            </p>
            <button class="ai-btn" id="aiGenerateBtn">🔮 生成当前时空命盘并AI推演</button>
            <div class="ai-status" id="aiStatus"></div>
            <div class="ai-output" id="aiOutput" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
(function() {
    // ==================== 全局变量与工具函数 ====================
    const canvas = document.getElementById('luopanCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');
    const DPR = Math.min(window.devicePixelRatio||1,2);
    const BASE=1200; canvas.width=BASE*DPR; canvas.height=BASE*DPR; canvas.style.width='100%'; canvas.style.height='100%';
    ctx.scale(DPR,DPR);
    const W=BASE, H=BASE, CX=W/2, CY=H/2;
    const MAX_R=550, CENTER_R=46;
    const COL = {
        bg:'#0a0f0a', ringLine:'rgba(0,255,200,0.5)', ringLineThin:'rgba(0,200,150,0.35)',
        ringFill:'rgba(5,30,20,0.7)', ringFillAlt:'rgba(8,35,25,0.65)',
        textLight:'#ccffdd', textDim:'#5a8f7a', textBright:'#e0ffee',
        wood:'#2ecc71', fire:'#e74c3c', earth:'#f1c40f', metal:'#bdc3c7', water:'#3498db',
        yin:'#0a1a0f', yang:'#d0f0e0', neonGlow:'#33ffaa'
    };
    const TIAN_GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

    // 动态计算环的实际半径
    function calcRings(){
        const staticIds = ringDefsStatic.filter(r=>visibleState[r.id]).map(r=>r.id);
        const dynamicIds = (dynamicMode||clockMode) ? ringDefsDynamic.filter(r=>visibleState[r.id]).map(r=>r.id) : [];
        const allIds = [...staticIds, ...dynamicIds];
        if(!allIds.length){mappedRings={};return;}
        let minIn=Infinity, maxOut=-Infinity;
        allIds.forEach(id=>{
            const def = ringDefsStatic.find(r=>r.id===id) || ringDefsDynamic.find(r=>r.id===id);
            if(def.inner<minIn) minIn=def.inner; if(def.outer>maxOut) maxOut=def.outer;
        });
        const gap=8, start=CENTER_R+gap, end=MAX_R, span=maxOut-minIn;
        mappedRings={};
        allIds.forEach(id=>{
            const def = ringDefsStatic.find(r=>r.id===id) || ringDefsDynamic.find(r=>r.id===id);
            mappedRings[id]={
                inner: start + (def.inner-minIn)/span*(end-start),
                outer: start + (def.outer-minIn)/span*(end-start)
            };
        });
    }

    // 交互：拖动旋转
    function getRingIdAtPos(mx, my){
        for(const id of Object.keys(mappedRings)){
            const rng = mappedRings[id]; const dist = Math.sqrt((mx-CX)**2 + (my-CY)**2);
            if(dist >= rng.inner && dist <= rng.outer) return id;
        }
        if(Math.sqrt((mx-CX)**2 + (my-CY)**2) <= CENTER_R) return 'taichi';
        return null;
    }
    function handleDragStart(e){
        e.preventDefault();
        const rect = canvas.getBoundingClientRect(); const scaleX = BASE/rect.width, scaleY = BASE/rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const mx = (clientX - rect.left) * scaleX; const my = (clientY - rect.top) * scaleY;
        const ringId = getRingIdAtPos(mx, my);
        if(ringId && visibleState[ringId] !== false){
            selectedRingId = ringId; dragStartMouseAngle = Math.atan2(my-CY, mx-CX) * 180 / Math.PI;
            dragStartLayerRotation = layerRotations[ringId] || 0; isDragging = true;
        } else { selectedRingId = null; isDragging = false; }
        draw();
    }
    function handleDragMove(e){
        if(!isDragging || !selectedRingId) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect(); const scaleX = BASE/rect.width, scaleY = BASE/rect.height;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const mx = (clientX - rect.left) * scaleX; const my = (clientY - rect.top) * scaleY;
        const currentMouseAngle = Math.atan2(my-CY, mx-CX) * 180 / Math.PI;
        let delta = currentMouseAngle - dragStartMouseAngle;
        if(delta > 180) delta -= 360; if(delta < -180) delta += 360;
        layerRotations[selectedRingId] = dragStartLayerRotation + delta;
        draw();
    }
    function handleDragEnd(){ if(isDragging){ isDragging=false; selectedRingId=null; saveState(); draw(); } }
    canvas.addEventListener('mousedown', handleDragStart);
    canvas.addEventListener('mousemove', handleDragMove);
    canvas.addEventListener('mouseup', handleDragEnd);
    canvas.addEventListener('mouseleave', handleDragEnd);
    canvas.addEventListener('touchstart', handleDragStart, {passive: false});
    canvas.addEventListener('touchmove', handleDragMove, {passive: false});
    canvas.addEventListener('touchend', handleDragEnd);

    function draw(){
        ctx.clearRect(0,0,W,H); ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H);
        if(dynamicMode) updateQiMen();
        calcRings();
        const visIds = Object.keys(mappedRings);
        for(let i=visIds.length-1; i>=0; i--){
            const id = visIds[i]; if(!visibleState[id]) continue;
            const rng = mappedRings[id]; const fill = i%2===0 ? COL.ringFill : COL.ringFillAlt;
            ringSeg(rng.inner, rng.outer, 0, 360, fill, null);
        }
        drawTaiChi({inner:0, outer:CENTER_R}, layerRotations['taichi']||0);
        for(const id of visIds){
            if(!visibleState[id]) continue;
            const rng = mappedRings[id]; const rotation = layerRotations[id] || 0;
            ctx.save(); ctx.translate(CX, CY); ctx.rotate(rotation * Math.PI/180); ctx.translate(-CX, -CY);
            switch(id){
                case 'liangyi': drawLiangYi(rng); break;
                case 'sixiang2': drawSixiang2(rng); break;
                case 'sixiang': drawSiXiang(rng); break;
                case 'wuxing': drawWuXing(rng); break;
                case 'qixing': drawQiXing(rng); break;
                case 'bagua': drawBaGua(rng); break;
                case 'bamen': if(!dynamicMode) drawStaticBaMen(rng); break;
                case 'jiugong': drawJiuGong(rng); break;
                case 'tiangan': if(!dynamicMode) drawStaticTianGan(rng); break;
                case 'shengxiao': drawShengXiao(rng); break;
                case 'shifang': drawShiFang(rng); break;
                case 'jieqi': drawJieQi(rng); break;
                case 'xiu': drawXiu(rng); break;
                case 'gua64': drawGua64(rng); break;
                case 'dizhi': drawDiZhi(rng); break;
                case 'dy_bamen': if(dynamicMode||clockMode) drawDynamicBaMen(rng); break;
                case 'dy_tiangan': if(dynamicMode||clockMode) drawDynamicTianGan(rng); break;
                case 'jiuxing': if(dynamicMode||clockMode) drawDynamicJiuXing(rng); break;
                case 'bashen': if(dynamicMode||clockMode) drawDynamicBaShen(rng); break;
            }
            ctx.restore();
            if(selectedRingId === id){
                ctx.beginPath(); ctx.arc(CX, CY, rng.inner, 0, Math.PI*2); ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath(); ctx.arc(CX, CY, rng.outer, 0, Math.PI*2); ctx.stroke();
            }
        }
        drawHighlightedLayers();
        drawClockHands();
        drawDecorations();
        updateInfoBar();
        saveState();
        updateButtonTexts();
    }

    // ==================== 八字四柱完整代码 ====================
    function getSolarTermDate(year, angle) {
        const PI = Math.PI, RAD = PI/180;
        function sunLongitude(jd) {
            const t = (jd - 2451545.0)/36525.0;
            const L0 = 280.46646 + 36000.76983*t + 0.0003032*t*t;
            const M = 357.52911 + 35999.05029*t - 0.0001537*t*t;
            const C = (1.914602 - 0.004817*t - 0.000014*t*t)*Math.sin(M*RAD) + (0.019993 - 0.000101*t)*Math.sin(2*M*RAD) + 0.000289*Math.sin(3*M*RAD);
            let lambda = L0 + C + 0.0048*Math.sin((125.04 - 1934.136*t)*RAD);
            return ((lambda % 360) + 360) % 360;
        }
        function jdToDate(jd) {
            const z = Math.floor(jd + 0.5), f = jd + 0.5 - z; let a = z;
            if (z >= 2299161) { const alpha = Math.floor((z - 1867216.25)/36524.25); a = z + 1 + alpha - Math.floor(alpha/4); }
            const b = a + 1524, c = Math.floor((b - 122.1)/365.25), d = Math.floor(365.25*c);
            const e = Math.floor((b - d)/30.6001);
            const day = b - d - Math.floor(30.6001*e) + f;
            const month = e < 14 ? e - 1 : e - 13;
            const year = month > 2 ? c - 4716 : c - 4715;
            const dayInt = Math.floor(day), frac = day - dayInt;
            return new Date(year, month-1, dayInt, Math.floor(frac*24), Math.floor((frac*24 - Math.floor(frac*24))*60));
        }
        function dateToJD(date) {
            let y = date.getFullYear(), m = date.getMonth()+1;
            const d = date.getDate() + date.getHours()/24 + date.getMinutes()/1440;
            if (m <= 2) { y--; m += 12; }
            const a = Math.floor(y/100);
            return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + (2 - a + Math.floor(a/4)) - 1524.5;
        }
        const jdStart = dateToJD(new Date(year,0,1));
        const jdEnd = dateToJD(new Date(year,11,31));
        let angleStart = sunLongitude(jdStart), angleEnd = sunLongitude(jdEnd);
        if (angleEnd < angleStart) angleEnd += 360;
        let target = angle;
        if (target < angleStart && angleStart > 300 && target < 60) target += 360;
        if (target < angleStart) target += 360;
        let left = jdStart, right = jdEnd;
        for (let i=0; i<50; i++) {
            const mid = (left + right)/2;
            let angleMid = sunLongitude(mid);
            if (angleMid < angleStart) angleMid += 360;
            if (angleMid < target) left = mid; else right = mid;
            if (Math.abs(right-left) < 0.0001) break;
        }
        return jdToDate((left + right)/2);
    }
    function getCachedSolarTerm(year, angle) {
        const key = year+'-'+angle;
        if (!solarTermCache[key]) solarTermCache[key] = getSolarTermDate(year, angle);
        return solarTermCache[key];
    }
    function getDayGanZhi(date) {
        const utc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const ref = new Date(Date.UTC(1900,0,1));
        const diff = Math.round((utc - ref)/86400000);
        const idx = ((10 + diff) % 60 + 60) % 60;
        return { gan: TIAN_GAN[idx%10], zhi: DI_ZHI[idx%12], ganIndex: idx%10, zhiIndex: idx%12 };
    }
    function getShiChen(hour, minute) {
        const total = hour*60 + minute;
        let idx;
        if (total >= 23*60 || total < 60) idx = 0;
        else if (total < 180) idx = 1;
        else if (total < 300) idx = 2;
        else if (total < 420) idx = 3;
        else if (total < 540) idx = 4;
        else if (total < 660) idx = 5;
        else if (total < 780) idx = 6;
        else if (total < 900) idx = 7;
        else if (total < 1020) idx = 8;
        else if (total < 1140) idx = 9;
        else if (total < 1260) idx = 10;
        else idx = 11;
        return { index: idx, zhi: DI_ZHI[idx], name: DI_ZHI[idx]+'时', isNextDay: total >= 23*60 };
    }
    function getMonthGanZhi(yearGan, monthZhiIndex) {
        const offset = (monthZhiIndex - 2 + 12) % 12;
        const yinGanIdx = TIAN_GAN.indexOf(WU_HU_DUN[yearGan]);
        return { gan: TIAN_GAN[(yinGanIdx + offset) % 10], zhi: DI_ZHI[monthZhiIndex] };
    }
    function getHourGanZhi(dayGan, shiChenIndex) {
        const ziGanIdx = TIAN_GAN.indexOf(WU_SHU_DUN[dayGan]);
        return { gan: TIAN_GAN[(ziGanIdx + shiChenIndex) % 10], zhi: DI_ZHI[shiChenIndex] };
    }
    function getShiShen(riGan, targetGan) {
        const riWx = GAN_WU_XING[riGan], riYy = GAN_YIN_YANG[riGan];
        const tgWx = GAN_WU_XING[targetGan], tgYy = GAN_YIN_YANG[targetGan];
        if (riWx === tgWx) return riYy === tgYy ? '比肩' : '劫财';
        const wxOrder = ['木','火','土','金','水'];
        const riIdx = wxOrder.indexOf(riWx), tgIdx = wxOrder.indexOf(tgWx);
        if ((riIdx + 1) % 5 === tgIdx) return riYy === tgYy ? '食神' : '伤官';
        if ((tgIdx + 1) % 5 === riIdx) return riYy === tgYy ? '偏印' : '正印';
        if ((riIdx + 2) % 5 === tgIdx) return riYy === tgYy ? '偏财' : '正财';
        if ((tgIdx + 2) % 5 === riIdx) return riYy === tgYy ? '七杀' : '正官';
        return '';
    }
    function getFullShenSha(pillars) {
        const { year, month, day, hour } = pillars;
        const riGan = day.gan, riZhi = day.zhi;
        const zhiArr = [year.zhi, month.zhi, day.zhi, hour.zhi];
        const ganArr = [year.gan, month.gan, day.gan, hour.gan];
        const tianYiMap = {甲:['丑','未'],戊:['丑','未'],庚:['丑','未'],乙:['子','申'],己:['子','申'],丙:['亥','酉'],丁:['亥','酉'],辛:['午','寅'],壬:['卯','巳'],癸:['卯','巳']};
        const tianYiDay = zhiArr.map(z => tianYiMap[riGan]?.includes(z)||false);
        const tianYiYear = zhiArr.map(z => tianYiMap[year.gan]?.includes(z)||false);
        const wenChangMap = {甲:'巳',乙:'午',丙:'申',丁:'酉',戊:'申',己:'酉',庚:'亥',辛:'子',壬:'寅',癸:'卯'};
        const wenChangDay = zhiArr.map(z => z===wenChangMap[riGan]);
        const wenChangYear = zhiArr.map(z => z===wenChangMap[year.gan]);
        const taoHuaMap = {寅:'卯',午:'卯',戌:'卯',申:'酉',子:'酉',辰:'酉',亥:'子',卯:'子',未:'子',巳:'午',酉:'午',丑:'午'};
        const taoHuaNian = zhiArr.map(z => z===taoHuaMap[year.zhi]);
        const taoHuaRi = zhiArr.map(z => z===taoHuaMap[riZhi]);
        const yiMaMap = {申:'寅',子:'寅',辰:'寅',寅:'申',午:'申',戌:'申',亥:'巳',卯:'巳',未:'巳',巳:'亥',酉:'亥',丑:'亥'};
        const yiMaNian = zhiArr.map(z => z===yiMaMap[year.zhi]);
        const yiMaRi = zhiArr.map(z => z===yiMaMap[riZhi]);
        const huaGaiMap = {寅:'戌',午:'戌',戌:'戌',亥:'未',卯:'未',未:'未',申:'辰',子:'辰',辰:'辰',巳:'丑',酉:'丑',丑:'丑'};
        const huaGaiNian = zhiArr.map(z => z===huaGaiMap[year.zhi]);
        const huaGaiRi = zhiArr.map(z => z===huaGaiMap[riZhi]);
        const yangRenMap = {甲:'卯',乙:'寅',丙:'午',丁:'巳',戊:'午',己:'巳',庚:'酉',辛:'申',壬:'子',癸:'亥'};
        const yangRen = zhiArr.map(z => z===yangRenMap[riGan]);
        const tianDeMap = {寅:'丁',卯:'申',辰:'壬',巳:'辛',午:'亥',未:'甲',申:'癸',酉:'寅',戌:'丙',亥:'乙',子:'巳',丑:'庚'};
        const tianDeGan = tianDeMap[month.zhi];
        const tianDe = ganArr.map(g => g === tianDeGan);
        const yueDeMap = {寅午戌:'丙',亥卯未:'甲',申子辰:'壬',巳酉丑:'庚'};
        const yueDeGan = yueDeMap[Object.keys(yueDeMap).find(key => key.includes(month.zhi))];
        const yueDe = ganArr.map(g => g === yueDeGan);
        const luShenMap = {甲:'寅',乙:'卯',丙:'巳',丁:'午',戊:'巳',己:'午',庚:'申',辛:'酉',壬:'亥',癸:'子'};
        const luShen = zhiArr.map(z => z===luShenMap[riGan]);
        const jinYuMap = {甲:'辰',乙:'巳',丙:'未',丁:'申',戊:'未',己:'申',庚:'戌',辛:'亥',壬:'丑',癸:'寅'};
        const jinYu = zhiArr.map(z => z===jinYuMap[riGan]);
        const fuXingMap = {甲:'丑',乙:'寅',丙:'子',丁:'酉',戊:'申',己:'未',庚:'午',辛:'巳',壬:'辰',癸:'卯'};
        const fuXing = zhiArr.map(z => z===fuXingMap[riGan]);
        const xueTangMap = {甲:'亥',乙:'午',丙:'寅',丁:'酉',戊:'寅',己:'酉',庚:'巳',辛:'子',壬:'申',癸:'卯'};
        const xueTang = zhiArr.map(z => z===xueTangMap[riGan]);
        const wangShenMap = {子:'亥',丑:'申',寅:'巳',卯:'寅',辰:'亥',巳:'申',午:'巳',未:'寅',申:'亥',酉:'申',戌:'巳',亥:'寅'};
        const wangShen = zhiArr.map(z => z===wangShenMap[riZhi]);
        const jieShaMap = {子:'巳',丑:'寅',寅:'亥',卯:'申',辰:'巳',午:'寅',未:'亥',申:'申',酉:'巳',戌:'寅',亥:'亥'};
        const jieSha = zhiArr.map(z => z===jieShaMap[riZhi]);

        const yuanChen = zhiArr.map(z => z===yuanChenMap[riZhi]);
        const jiangXingMap = {子:'子',丑:'酉',寅:'午',卯:'卯',辰:'子',巳:'酉',午:'午',未:'卯',申:'子',酉:'酉',戌:'午',亥:'卯'};

    }

    function calculateBaZi(birthDate, birthTime, gender='') {
        const year = birthDate.getFullYear();
        const liChun = getCachedSolarTerm(year, 315);
        const effectiveYear = birthDate < liChun ? year-1 : year;
        const yearGanIdx = ((effectiveYear-4)%10+10)%10;
        const yearZhiIdx = ((effectiveYear-4)%12+12)%12;
        const yearGan = TIAN_GAN[yearGanIdx], yearZhi = DI_ZHI[yearZhiIdx];
        const prevXiaoHan = getCachedSolarTerm(year-1, 285);
        const boundaries = JIE_QI_MONTH_MAP.map(b => ({...b, date: getCachedSolarTerm(year, b.angle)}));
        const nextLiChun = getCachedSolarTerm(year+1, 315);
        let allBoundaries = [{zhiIndex:1, date:prevXiaoHan, name:'小寒'}, ...boundaries.map(b=>({zhiIndex:b.zhiIndex, date:b.date, name:b.name})), {zhiIndex:2, date:nextLiChun, name:'立春(次年)'}];
        allBoundaries.sort((a,b) => a.date - b.date);
        let monthZhiIndex = 0, matched = null;
        for (let i=0; i<allBoundaries.length-1; i++) {
            if (birthDate >= allBoundaries[i].date && birthDate < allBoundaries[i+1].date) {
                monthZhiIndex = allBoundaries[i].zhiIndex;
                matched = allBoundaries[i];
                break;
            }
        }
        const monthPillar = getMonthGanZhi(yearGan, monthZhiIndex);
        const dayPillar = getDayGanZhi(birthDate);
        const shiChen = getShiChen(birthTime.getHours(), birthTime.getMinutes());
        const effectiveDate = shiChen.isNextDay ? new Date(birthDate.getTime() + 86400000) : birthDate;
        const effectiveDayPillar = shiChen.isNextDay ? getDayGanZhi(effectiveDate) : dayPillar;
        const hourPillar = getHourGanZhi(effectiveDayPillar.gan, shiChen.index);
        return {year: { gan: yearGan, zhi: yearZhi, shengXiao: SHENG_XIAO[yearZhiIdx] }, month: monthPillar, day: dayPillar, hour: hourPillar, shiChen, effectiveDay: effectiveDayPillar, liChun, matchedBoundary: matched, effectiveYear, birthDate, birthTime, gender};
    }

    function generateBaziSummary(res, shenSha, wxCount) {
        const riGan = res.day.gan; const riWx = GAN_WU_XING[riGan];
        const ganList = [res.year.gan, res.month.gan, res.day.gan, res.hour.gan];
        const shiShenCount = {};
        ganList.forEach(g => { const ss = getShiShen(riGan, g); shiShenCount[ss] = (shiShenCount[ss]||0) + 1; });
        const shenShaNames = [];
        if (shenSha.tianYiDay[2]) shenShaNames.push('日柱天乙贵人');
        if (shenSha.wenChangDay[2]) shenShaNames.push('日柱文昌贵人');
        if (shenSha.taoHuaNian[2]) shenShaNames.push('年支桃花在日');
        if (shenSha.huaGaiRi[1]) shenShaNames.push('月柱华盖');
        if (shenSha.fuXing[2]) shenShaNames.push('日柱福星贵人');
        if (shenSha.xueTang[2]) shenShaNames.push('日柱学堂');
        if (shenSha.jiangXing[2]) shenShaNames.push('日柱将星');
        let summary = `<strong>☯️ 命理总结</strong><br><br>`;
        summary += `<strong>日主：</strong>${riGan}（${riWx}，${GAN_YIN_YANG[riGan]}性），生于${res.month.zhi}月，日支坐${res.day.zhi}。<br>`;
        summary += `<strong>五行力量：</strong>土${wxCount['土']}、火${wxCount['火']}、木${wxCount['木']}、水${wxCount['水']}、金${wxCount['金']}。<br>`;
        summary += `<strong>十神特征：</strong>年柱透<strong>${getShiShen(riGan, res.year.gan)}</strong>，月柱透<strong>${getShiShen(riGan, res.month.gan)}</strong>，日时两柱<strong>${getShiShen(riGan, res.day.gan)}</strong>。<br>`;
        if (shenShaNames.length>0) summary += `<strong>神煞加临：</strong>${shenShaNames.join('、')}。<br>`;
        summary += `<strong>综合：</strong>已生成完整命理分析。`;
        return summary;
    }

    function handleBaziCalc() {
        const dateStr = document.getElementById('baziDate').value;
        const timeStr = document.getElementById('baziTime').value;
        const gender = document.getElementById('baziGender').value;
        if (!dateStr || !timeStr) { document.getElementById('baziError').textContent = '⚠ 请完整填写日期和时间'; document.getElementById('baziError').classList.add('show'); return; }
        const [y,m,d] = dateStr.split('-').map(Number);
        const [h,min] = timeStr.split(':').map(Number);
        const birthDate = new Date(y, m-1, d);
        const birthTime = new Date(y, m-1, d, h, min||0);
        if (isNaN(birthDate) || isNaN(birthTime) || h<0 || h>23 || (min||0)<0 || (min||0)>59) { document.getElementById('baziError').textContent = '⚠ 日期或时间无效'; document.getElementById('baziError').classList.add('show'); return; }
        if (y<1900 || y>2100) { document.getElementById('baziError').textContent = '⚠ 年份请选择1900-2100之间'; document.getElementById('baziError').classList.add('show'); return; }
        saveBaziInputs();
        try {
            const res = calculateBaZi(birthDate, birthTime, gender);
            displayBaziResult(res);
        } catch(e) { document.getElementById('baziError').textContent = '⚠ 计算出错：'+e.message; document.getElementById('baziError').classList.add('show'); }
    }

        lines.push(`日主：${riGan}（${GAN_WU_XING[riGan]}，${GAN_YIN_YANG[riGan]}），生于${res.month.zhi}月，时辰${res.shiChen.name}`);
        lines.push(`十神（以日干论）：年柱${getShiShen(riGan, res.year.gan)}、月柱${getShiShen(riGan, res.month.gan)}、日柱${getShiShen(riGan, res.day.gan)}、时柱${getShiShen(riGan, res.hour.gan)}`);
        lines.push(`地支藏干十神：年${ZHI_CANG_GAN[res.year.zhi].map(cg=>cg+'('+getShiShen(riGan,cg)+')').join('、')}；月${ZHI_CANG_GAN[res.month.zhi].map(cg=>cg+'('+getShiShen(riGan,cg)+')').join('、')}；日${ZHI_CANG_GAN[res.day.zhi].map(cg=>cg+'('+getShiShen(riGan,cg)+')').join('、')}；时${ZHI_CANG_GAN[res.hour.zhi].map(cg=>cg+'('+getShiShen(riGan,cg)+')').join('、')}`);
        const shenList = [];
        ['tianYiDay','wenChangDay','taoHuaRi','yiMaRi','huaGaiRi','yangRen','tianDe','yueDe','luShen','jinYu','fuXing','xueTang','wangShen','jieSha','yuanChen','jiangXing','tianShe'].forEach(k=>{
            const arr = shenSha[k];
            const cols = ['年柱','月柱','日柱','时柱'];
            arr.forEach((v,i)=>{ if(v) shenList.push(`${cols[i]}${k}`); });
        });
        lines.push(`神煞：${shenList.length ? shenList.join('、') : '无显著神煞'}`);
        lines.push(`五行力量（含藏干）：土${wxCount['土']}、火${wxCount['火']}、木${wxCount['木']}、水${wxCount['水']}、金${wxCount['金']}`);
        return lines.join('\n');
    }

    function buildAIPrompt(){
        const luopan = collectLuopanState();
        const now = new Date();
        let prompt = `【当前时空信息】\n`;
        prompt += `当前时间：${luopan.time}\n`;
        prompt += `奇门罗盘状态：朝向 ${luopan.orientation}（${luopan.direction}），定位 ${luopan.location}\n`;
        prompt += `排盘模式：${luopan.qiMenDesc}，动态排盘：${luopan.dynamicMode?'开':'关'}，钟表形态：${luopan.clockMode?'开':'关'}\n`;
        prompt += `罗盘当前高亮：${luopan.highlighted}\n\n`;

        if(baziGlobal){
            prompt += `【命主八字（先天命盘）】\n${formatBaziResult(baziGlobal, '出生四柱八字')}\n\n`;
        } else {
            prompt += `【命主八字】\n尚未进行八字排盘，请在“八字四柱”标签页输入出生时间后排盘。\n\n`;
        }

        try {
            const currentBazi = calculateBaZi(now, now);
            prompt += `【当前时空四柱（今日当下）】\n${formatBaziResult(currentBazi, '当前年月日时')}\n\n`;
        } catch(e) {
            prompt += `【当前时空四柱】\n获取失败：${e.message}\n\n`;
        }

        prompt += `【推演要求】\n`;
        prompt += `你是一位精通奇门遁甲、八字命理、风水堪舆、五行神煞的命理大师。\n`;
        prompt += `请将以上“命主八字（先天命盘）”与“当前时空四柱（今日当下）”组合为八柱，\n`;
        prompt += `再结合奇门罗盘的当前朝向、方位、八门、八卦、星宿、节气、六十四卦等时空信息，\n`;
        prompt += `从以下维度进行详细推演今日运势：\n`;
        prompt += `1. 四柱结构与日主强弱；\n`;
        prompt += `2. 十神配置与今日事业、财运、感情、健康提示；\n`;
        prompt += `3. 五行旺衰、喜忌与平衡建议；\n`;
        prompt += `4. 神煞（天乙、文昌、桃花、驿马、华盖、羊刃、天德、月德、禄神等）对今日的影响；\n`;
        prompt += `5. 奇门罗盘当前方位对应的吉凶（八门、八卦、星宿、节气、六十四卦综合解读）；\n`;
        prompt += `6. 当前时空能量场与命盘的相互作用；\n`;
        prompt += `7. 今日宜忌、有利方位、有利时辰、行动建议；\n`;
        prompt += `8. 整体运势总结与注意事项。\n`;
        prompt += `请用专业、详尽、有条理的中文回答，可引用经典命理术语并给出通俗解释。`;
        return prompt;
    }

    // 轻量 Markdown 渲染器（基础语法：标题、加粗、斜体、列表、代码块、行内代码、换行）
    function renderMarkdown(md){
        if(!md) return '';
        const codeBlocks = [];
        md = md.replace(/```(\w*)\n([\s\S]*?)\n```/g, (m, lang, code) => {
            codeBlocks.push(escapeHtml(code));
            return '\u0000CODE' + (codeBlocks.length - 1) + '\u0000';
        });
        const inlineCodes = [];
        md = md.replace(/`([^`]+)`/g, (m, code) => {
            inlineCodes.push(escapeHtml(code));
            return '\u0000INLINE' + (inlineCodes.length - 1) + '\u0000';
        });
        let text = escapeHtml(md);
        text = text.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, '<em>$1</em>');
        text = text.replace(/__([^_]+?)__/g, '<strong>$1</strong>');
        text = text.replace(/_([^_]+?)_/g, '<em>$1</em>');
        const lines = text.split('\n');
        let html = '';
        let inList = false;
        let listType = '';
        let paraBuf = [];
        function flushPara(){
            if(paraBuf.length){ html += '<p>' + paraBuf.join('<br>') + '</p>'; paraBuf = []; }
            if(inList){ html += listType === 'ul' ? '</ul>' : '</ol>'; inList = false; listType = ''; }
        }
        for(let i=0;i<lines.length;i++){
            const line = lines[i];
            const hMatch = line.match(/^(#{1,6})\s+(.+)$/);
            if(hMatch){ flushPara(); const level = hMatch[1].length; html += `<h${level}>${hMatch[2]}</h${level}>`; continue; }
            const ulMatch = line.match(/^[-*]\s+(.+)$/);
            if(ulMatch){
                if(!inList || listType !== 'ul'){ flushPara(); html += '<ul>'; inList = true; listType = 'ul'; }
                html += `<li>${ulMatch[1]}</li>`; continue;
            }
            const olMatch = line.match(/^\d+\.\s+(.+)$/);
            if(olMatch){
                if(!inList || listType !== 'ol'){ flushPara(); html += '<ol>'; inList = true; listType = 'ol'; }
                html += `<li>${olMatch[1]}</li>`; continue;
            }
            if(line.trim() === ''){ flushPara(); continue; }
            if(inList) flushPara();
            paraBuf.push(line);
        }
        flushPara();
        html = html.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => `<pre><code>${codeBlocks[i]}</code></pre>`);
        html = html.replace(/\u0000INLINE(\d+)\u0000/g, (m, i) => `<code>${inlineCodes[i]}</code>`);
        return html;
    }

    document.getElementById('aiGenerateBtn').addEventListener('click', async ()=>{
        const apiKey = document.getElementById('aiApiKey').value.trim();
        if(!apiKey){ alert('请先输入 DeepSeek API Key 并保存'); return; }
        const model = document.getElementById('aiModel').value;
        const reasoning = document.getElementById('aiReasoning').value;
        const status = document.getElementById('aiStatus');
        const output = document.getElementById('aiOutput');
        const btn = document.getElementById('aiGenerateBtn');
        btn.disabled = true;
        status.textContent = '⏳ 正在构建时空命盘并请求 DeepSeek AI...';
        output.style.display = 'block';
        output.innerHTML = '<div style="color:var(--text-dim)">正在构建 prompt...</div>';

        const prompt = buildAIPrompt();
        try {
            const payload = {
                model: model,
                messages: [
                    {role: 'system', content: '你是一位精通奇门遁甲、八字命理、风水堪舆、五行神煞的命理大师。请结合用户提供的奇门罗盘时空数据与八字命盘，进行专业、详尽、有条理的今日运势推演。'},
                    {role: 'user', content: prompt}
                ],
                stream: false
            };
            if(model !== 'deepseek-chat'){
                payload.thinking = {type: 'enabled'};
                payload.reasoning_effort = reasoning;
            }
            const response = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(payload)
            });
            if(!response.ok){
                const errText = await response.text();
                throw new Error(`API 错误 ${response.status}: ${errText}`);
            }
            const data = await response.json();
            const msg = data.choices?.[0]?.message || {};
            let html = '';
            if(msg.reasoning_content){
                html += `<details class="ai-reasoning-details"><summary>💭 AI 思考过程（点击展开）</summary><div class="reasoning">${renderMarkdown(msg.reasoning_content)}</div></details>`;
            }
            html += `<div class="answer"><strong>✨ 推演结果</strong><br>${renderMarkdown(msg.content || '')}</div>`;
            output.innerHTML = html;
            status.textContent = '✓ 推演完成';
        } catch(e) {
            output.innerHTML = `<div style="color:#ff9999">请求失败：${escapeHtml(e.message)}<br><br>提示：浏览器直接调用 DeepSeek API 可能受 CORS 限制，请确保 API Key 正确且网络允许跨域请求；也可在本地启动一个代理服务转发请求。</div>`;
            status.textContent = '✗ 请求失败';
        } finally {
            btn.disabled = false;
        }
    });

    loadAiApiKey();

    buildUI(); draw(); setInterval(draw, 1000);
    window.addEventListener('resize',draw);
})();
</script>
